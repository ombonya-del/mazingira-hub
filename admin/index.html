<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · MazingiraKenya</title>
<meta name="description" content="Moderation & operations console for the MazingiraKenya Communications Hub.">
<meta name="theme-color" content="#080F0C">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1A15'/%3E%3Ctext x='31' y='45' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%2362C79B'%3EA%3C/text%3E%3Ccircle cx='48' cy='18' r='6' fill='%23F2762F'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#080F0C; --panel:#0E1A15; --panel-2:#12241C; --panel-3:#16302410;
  --line:#1E3228; --line-2:#254036;
  --text:#E8F0EA; --muted:#8FA89A; --muted-dim:#5F7A6D;
  --green:#62C79B; --green-deep:#2E9B6E; --green-ink:#0C3B29;
  --ember:#F2762F; --ember-soft:#EE9455; --ember-wash:rgba(242,118,47,.12);
  --red:#E5625A; --red-wash:rgba(229,98,90,.14);
  --gold:#E8B45A; --amber-wash:rgba(232,180,90,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --nav-w:224px; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Nunito Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Lora",Georgia,serif;margin:0 0 .3em;font-weight:700;line-height:1.2}
p{margin:0 0 .7em}
a{color:var(--green);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.kicker{font-size:.64rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-dim)}

/* ---------- access gate ---------- */
.gate{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 120% at 80% -10%,#123,#080F0C 60%);display:flex;align-items:center;justify-content:center;padding:24px}
.gate.hidden{display:none}
.gate .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px 26px;max-width:380px;width:100%;text-align:center}
.gate .lock{width:52px;height:52px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.gate h1{font-size:1.4rem}
.gate p{color:var(--muted);font-size:.9rem}
.gate input{width:100%;background:#0a1712;border:1px solid var(--line-2);border-radius:10px;color:var(--text);padding:12px;font-family:inherit;font-size:1rem;margin:14px 0 12px;text-align:center;letter-spacing:.12em}
.gate button{width:100%;border:0;background:var(--green);color:#04140d;font-weight:900;padding:12px;border-radius:10px;font-size:.95rem}
.gate .hint{font-size:.72rem;color:var(--muted-dim);margin-top:14px}

/* ---------- shell ---------- */
.shell{display:none}
.shell.on{display:block}
.topbar{position:sticky;top:0;z-index:60;background:rgba(8,15,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;font-family:"Lora",serif;font-weight:700;font-size:1.06rem}
.brand .tag{font-size:.6rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ember);border:1px solid var(--ember);border-radius:5px;padding:2px 6px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:9px;background:var(--green-deep);color:#04140d;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8rem}
.who .nm{font-size:.82rem;font-weight:800;line-height:1}
.who .rl{font-size:.66rem;color:var(--muted)}
.signout{background:none;border:1px solid var(--line-2);color:var(--muted);border-radius:8px;padding:6px 10px;font-weight:800;font-size:.72rem}

.layout{display:flex;min-height:calc(100vh - 56px)}
.sidenav{display:none;flex:0 0 var(--nav-w);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:56px;height:calc(100vh - 56px)}
.sidenav .grp{font-size:.6rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-dim);margin:8px 10px 6px}
.sidenav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:var(--muted);font-weight:800;font-size:.9rem;padding:11px 12px;border-radius:10px;margin-bottom:2px}
.sidenav button:hover{background:var(--panel);color:var(--text)}
.sidenav button[aria-current="true"]{background:var(--panel-2);color:var(--text)}
.sidenav button[aria-current="true"] .ico{color:var(--green)}
.sidenav .ico{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sidenav .badge{margin-left:auto;background:var(--ember);color:#1a0d03;font-size:.66rem;font-weight:900;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}

/* mobile top tabs */
.mtabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:56px;z-index:50;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-weight:800;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;padding:12px 13px 10px;white-space:nowrap}
.mtabs button[aria-current="true"]{color:var(--text);border-bottom-color:var(--ember)}
.mtabs .badge{background:var(--ember);color:#1a0d03;font-size:.6rem;font-weight:900;border-radius:999px;padding:0 5px;margin-left:5px}

.main{flex:1;min-width:0;padding:20px 18px 60px;max-width:1080px;margin:0 auto;width:100%}
.view{animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:1.5rem;margin:0}
.page-head p{margin:0;color:var(--muted);font-size:.9rem}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.kpi .n{font-family:"Lora",serif;font-size:1.9rem;font-weight:700;line-height:1}
.kpi .l{font-size:.74rem;color:var(--muted);font-weight:700;margin-top:5px}
.kpi .d{font-size:.68rem;font-weight:800;margin-top:6px}
.kpi .d.up{color:var(--green)} .kpi .d.warn{color:var(--ember)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h3{font-size:1.06rem}
.sec-title{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.sec-title h3{margin:0;font-size:1.06rem}
.sec-title .rule{flex:1;height:1px;background:var(--line)}

/* filter pills */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:var(--panel);border:1px solid var(--line-2);color:var(--muted);border-radius:999px;padding:7px 13px;font-weight:800;font-size:.78rem}
.pill[aria-pressed="true"]{background:var(--panel-2);color:var(--text);border-color:var(--green-deep)}
.pill .c{opacity:.7;margin-left:4px}

/* queue cards */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.qcard .qtop{display:flex;gap:12px;align-items:flex-start;padding:14px 15px 8px}
.qcard .qav{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:900;color:#04140d}
.qcard .qwho{flex:1;min-width:0}
.qcard .qnm{font-weight:900;font-size:.92rem}
.qcard .qmeta{font-size:.72rem;color:var(--muted);font-weight:700}
.qcard .qbody{padding:0 15px 10px;font-size:.94rem}
.qcard .qmedia{margin:0 15px 10px;height:96px;border-radius:10px;background:#0a1712;border:1px dashed var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.76rem;font-weight:800;letter-spacing:.04em}
.flags{display:flex;flex-wrap:wrap;gap:6px;padding:0 15px 10px}
.flag{font-size:.66rem;font-weight:900;letter-spacing:.03em;padding:3px 8px;border-radius:999px;border:1px solid}
.flag.ok{color:var(--green);border-color:var(--green-deep);background:rgba(98,199,155,.08)}
.flag.warn{color:var(--gold);border-color:var(--gold);background:var(--amber-wash)}
.flag.bad{color:var(--red);border-color:var(--red);background:var(--red-wash)}
.qact{display:flex;gap:8px;flex-wrap:wrap;padding:10px 15px 14px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);border-radius:9px;padding:8px 13px;font-weight:800;font-size:.8rem}
.btn:hover{border-color:var(--muted)}
.btn.approve{background:var(--green);color:#04140d;border-color:var(--green)}
.btn.reject{background:transparent;color:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.pub{background:var(--ember);color:#1a0d03;border-color:var(--ember)}
.btn:disabled{opacity:.5;cursor:default}
.type-tag{font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted)}
.status-tag{font-size:.62rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.st-pending{background:var(--amber-wash);color:var(--gold)} .st-approved{background:rgba(98,199,155,.12);color:var(--green)} .st-rejected{background:var(--red-wash);color:var(--red)} .st-live{background:var(--ember-wash);color:var(--ember-soft)} .st-ready{background:var(--panel-2);color:var(--muted)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-dim);font-weight:900;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--panel-2)}
.tbl .org{font-weight:800}
.role-sel{background:#0a1712;border:1px solid var(--line-2);color:var(--text);border-radius:7px;padding:5px 8px;font-family:inherit;font-weight:700;font-size:.78rem}
.toggle{width:40px;height:23px;border-radius:999px;border:1px solid var(--line-2);background:#0a1712;position:relative;cursor:pointer;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:.15s}
.toggle[aria-pressed="true"]{background:var(--green-deep);border-color:var(--green)}
.toggle[aria-pressed="true"]::after{left:19px;background:#04140d}

/* content list */
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .ct{flex:1;min-width:0}
.crow .ct b{font-weight:800}
.crow .ct .s{font-size:.74rem;color:var(--muted)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:0 0 auto;cursor:pointer;position:relative}
.radio[aria-checked="true"]{border-color:var(--gold)}
.radio[aria-checked="true"]::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}

/* bar chart */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:flex;align-items:center;gap:10px;font-size:.8rem}
.bar .lab{width:78px;color:var(--muted);font-weight:800}
.bar .track{flex:1;height:14px;background:#0a1712;border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px}
.bar .val{width:40px;text-align:right;font-weight:800}

.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.feed li:last-child{border-bottom:0}
.feed .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto}
.feed .t{color:var(--muted-dim);font-size:.72rem;margin-left:auto;white-space:nowrap;font-weight:700}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--panel-2);border:1px solid var(--green-deep);color:var(--text);padding:11px 18px;border-radius:11px;font-weight:800;font-size:.85rem;box-shadow:var(--shadow);opacity:0;transition:.22s;z-index:120;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:110;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;max-width:520px;width:100%;box-shadow:var(--shadow);overflow:hidden}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:1.1rem}
.modal .mx{margin-left:auto;background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1}
.modal .mb{padding:16px 18px;max-height:60vh;overflow:auto}
.modal label{display:block;font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 5px}
.modal input,.modal textarea,.modal select{width:100%;background:#0a1712;border:1px solid var(--line-2);color:var(--text);border-radius:9px;padding:10px;font-family:inherit;font-size:.9rem}
.upl-form label{display:block;font-size:.72rem;font-weight:800;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.upl-form input,.upl-form textarea,.upl-form select{width:100%;background:#0a1712;border:1px solid var(--line-2);color:var(--text);border-radius:9px;padding:10px;font-family:inherit;font-size:.9rem;color-scheme:dark}
.upl-form input[type="date"]{cursor:pointer}
.upl-form input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer;opacity:.9}
.upl-form textarea{resize:vertical}
.eng-slots{display:flex;gap:10px}
.eng-slots span{flex:1;display:flex;flex-direction:column}
.eng-slots small{font-size:.66rem;font-weight:800;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.modal .mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
/* narrative disinfo queue */
.ndpipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px;font-size:.62rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.ndpipe .np{padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);background:var(--panel)}
.ndpipe .np.ai{border-color:#7FB0D8;color:#7FB0D8} .ndpipe .np.hum{border-color:var(--ember);color:var(--ember-soft)} .ndpipe .np.live{border-color:var(--green);color:var(--green)}
.ndpipe .npa{color:var(--muted)}
.nd-vf-edge{border-left:4px solid #E5625A} .nd-vm-edge{border-left:4px solid #E8B45A} .nd-vp-edge{border-left:4px solid #EE9455} .nd-vc-edge{border-left:4px solid #7FB0D8}
.type-tag.nd-vf{background:#E5625A;color:#180505;border-color:#E5625A} .type-tag.nd-vm{background:#E8B45A;color:#231a04;border-color:#E8B45A} .type-tag.nd-vp{background:#EE9455;color:#1a0d03;border-color:#EE9455} .type-tag.nd-vc{background:#7FB0D8;color:#08131c;border-color:#7FB0D8}
.nd-quote{margin:2px 0 12px;padding:11px 13px;background:#0a1712;border-left:3px solid var(--line-2);border-radius:0 8px 8px 0;font-style:italic;color:var(--text);font-size:.9rem;line-height:1.5}
.ndr-draft{border-left:3px solid var(--green);background:rgba(98,199,155,.06);border-radius:0 8px 8px 0;padding:11px 13px;margin:0 0 10px}
.ndr-draft .ndr-lab{display:inline-block;margin-bottom:6px;font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:#7FB0D8}
.ndr-draft p{margin:0;font-size:.9rem;line-height:1.5}
.ndr-meta{font-size:.78rem;color:var(--muted);margin:6px 0 0} .ndr-meta b{color:var(--text)}
.ndshare{margin-top:12px;border:1px solid var(--green);border-radius:12px;overflow:hidden}
.ndshare-h{background:var(--green);color:#04140d;font-weight:900;font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;padding:7px 13px}
.ndshare-b{padding:13px}
.ndshare-flag{display:inline-block;font-size:.58rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;background:#E5625A;color:#180505;padding:3px 9px;border-radius:999px;margin-bottom:7px}
.ndshare-b p{margin:0 0 10px;font-size:.9rem;line-height:1.5}
.ndshare-btns{display:flex;gap:7px;flex-wrap:wrap}
.ndshare-btn{font-size:.72rem;font-weight:800;border:1px solid var(--line-2);border-radius:8px;padding:6px 11px;color:var(--text);background:var(--panel)}
.ndshare-btn.x{background:#0b0b0b;color:#fff;border-color:#333} .ndshare-btn.wa{background:#128C7E;color:#fff;border-color:#128C7E}

@media(min-width:900px){ .sidenav{display:block} .mtabs{display:none} .main{padding:26px 28px 60px} }
</style>
</head>
<body>

<!-- ACCESS GATE (prototype) -->
<div class="gate" id="gate">
  <div class="card">
    <div class="lock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#62C79B" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>MazingiraKenya Admin</h1>
    <p>Moderation &amp; operations console. Authorised coalition staff only.</p>
    <input id="gcode" type="password" placeholder="Access code" autocomplete="off" aria-label="Access code">
    <button id="gbtn">Sign in</button>
    <p class="hint">Authorised coalition staff only. Production sign-in uses Supabase Auth + access control.</p>
  </div>
</div>

<!-- APP SHELL -->
<div class="shell" id="shell">
  <header class="topbar">
    <div class="brand">Mazingira<span style="color:var(--green)">Kenya</span> <span class="tag">Admin</span></div>
    <div class="who">
      <div style="text-align:right"><div class="nm">A. Mwangi</div><div class="rl">Coalition admin</div></div>
      <div class="avatar">AM</div>
      <button class="signout" id="toHub" title="Open the members' hub carrying your sign-in">Members' hub ↗</button>
      <button class="signout" id="signout">Sign out</button>
    </div>
  </header>

  <div class="mtabs" id="mtabs"></div>

  <div class="layout">
    <nav class="sidenav" id="sidenav" aria-label="Sections"></nav>
    <main class="main" id="app"></main>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================ MOCK DATA ============================ */
var NAV = [
  {id:"overview", label:"Overview", grp:"Console", icon:'<path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-4H4z"/>'},
  {id:"moderation", label:"Moderation", grp:"Publishing", icon:'<path d="M20 6 9 17l-5-5"/>', badgeFrom:"pending"},
  {id:"narrative", label:"Narrative disinfo", grp:"Publishing", icon:'<path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="M12 8v4M12 15h.01"/>', badgeFrom:"ndpending"},
  {id:"oppsreview", label:"Opportunities review", grp:"Publishing", icon:'<path d="M12 2v20M5 5l14 14M2 12h20M5 19 19 5"/>', badgeFrom:"oppending"},
  {id:"eventsreview", label:"Events review", grp:"Publishing", icon:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>', badgeFrom:"evpending"},

/* ============================ NAV ============================ */
function renderNav(){
  var side=document.getElementById("sidenav"), m=document.getElementById("mtabs");
  var groups=[], seen={};
  NAV.forEach(function(n){ if(!seen[n.grp]){seen[n.grp]=[];groups.push(n.grp);} seen[n.grp].push(n); });
  side.innerHTML=groups.map(function(g){
    return '<div class="grp">'+esc(g)+'</div>'+seen[g].map(navBtn).join("");
  }).join("");
  m.innerHTML=NAV.map(function(n){
    var b=n.badgeFrom?badgeVal(n):0;
    return '<button data-nav="'+n.id+'" aria-current="'+(state.view===n.id)+'">'+esc(n.label)+(b?'<span class="badge">'+b+'</span>':'')+'</button>';
  }).join("");
  bindNav();
}
function badgeVal(n){ return n.badgeFrom==="pending"?count("pending"):(n.badgeFrom==="ready"?pubCount("ready"):(n.badgeFrom==="ndpending"?ndCount("pending"):(n.badgeFrom==="oppending"?(state.oppPending||0):(n.badgeFrom==="evpending"?(state.evPending||0):0)))); }
function navBtn(n){
  var b=n.badgeFrom?badgeVal(n):0;
  return '<button data-nav="'+n.id+'" aria-current="'+(state.view===n.id)+'">'+
    '<svg class="ico" viewBox="0 0 24 24">'+n.icon+'</svg>'+esc(n.label)+
    (b?'<span class="badge">'+b+'</span>':'')+'</button>';
}
function bindNav(){
  document.querySelectorAll("[data-nav]").forEach(function(el){
    el.addEventListener("click",function(){ state.view=el.getAttribute("data-nav"); render(); });
  });
}

  if(v==="overview") app.innerHTML=viewOverview();

  else if(v==="publishing") app.innerHTML=viewPublishing();

  else if(v==="events") app.innerHTML=viewEvents();

}

function viewModeration(){
  state.modFilter = state.modFilter||"pending";
  var pills=[["pending","Pending"],["approved","Approved"],["rejected","Rejected"]].map(function(p){
    return '<button class="pill" data-mod="'+p[0]+'" aria-pressed="'+(state.modFilter===p[0])+'">'+p[1]+'<span class="c mono">'+count(p[0])+'</span></button>';
  }).join("");
  var list=SUBMISSIONS.filter(function(s){return s.status===state.modFilter;});
  var cards=list.length? list.map(subCard).join("") : '<div class="panel muted">Nothing in this queue.</div>';
  return '<section class="view"><div class="page-head"><div><h2>Moderation</h2><p>Review citizen Voices before anything is published. Check consent and privacy (Kenya DPA 2019).</p></div></div>'+
    '<div class="pills">'+pills+'</div>'+cards+'</section>';
}
function subCard(s){
  var flags="";
  flags+= s.consent ? '<span class="flag ok">✓ Consent given</span>' : '<span class="flag bad">✕ No consent</span>';
  if(s.minor) flags+='<span class="flag warn">⚠ Possible minor — guardian consent</span>';
  flags+='<span class="flag ok" style="color:var(--muted);border-color:var(--line-2);background:none">'+s.lang+'</span>';
  var media = s.type==="text" ? "" : '<div class="qmedia">'+s.type.toUpperCase()+' attachment · tap to preview</div>';
  var acts;
  if(s.status==="pending"){
    var canApprove = s.consent && !s.minor;
    acts='<button class="btn approve" data-act="approve:'+s.id+'"'+(canApprove?'':' disabled title="Resolve consent/privacy first"')+'>Approve</button>'+
      '<button class="btn ghost" data-act="changes:'+s.id+'">Request changes</button>'+
      '<button class="btn reject" data-act="reject:'+s.id+'">Reject</button>'+
      '<button class="btn" data-act="view:'+s.id+'" style="margin-left:auto">Open</button>';
  } else {
    acts='<span class="status-tag st-'+s.status+'">'+s.status+'</span>'+
      (s.status==="approved"?'<button class="btn pub" data-act="queue:'+s.id+'">Send to publish</button>':'')+
      '<button class="btn ghost" data-act="reopen:'+s.id+'" style="margin-left:auto">Reopen</button>';
  }
  return '<div class="qcard"><div class="qtop"><span class="qav" style="background:'+(AVCOLORS[s.type]||"#62C79B")+'">'+esc(s.name.charAt(0))+'</span>'+
    '<span class="qwho"><span class="qnm">'+esc(s.name)+'</span><span class="qmeta">'+esc(s.area)+' · '+esc(s.date)+'</span></span>'+
    '<span class="type-tag">'+s.type+'</span></div>'+
    media+'<div class="qbody">'+esc(s.msg)+'</div><div class="flags">'+flags+'</div>'+
    '<div class="qact">'+acts+'</div></div>';
}

function viewPublishing(){

function viewNarrative(){

    pipe+'<div class="pills">'+pills+'</div>'+cards+'</section>';

function ndCard(n){
  var head='<div class="qtop"><span class="qav" style="background:#0b0b0b;border:1px solid #333;color:#fff">'+esc(n.platform)+'</span>'+
    '<span class="qwho"><span class="qnm">'+esc(n.handle)+'</span><span class="qmeta">'+esc(n.meta)+'</span></span>'+
    '<span class="type-tag nd-'+n.tone+'">'+esc(n.type)+'</span></div>';
  var post='<div class="nd-quote">"'+esc(n.claim)+'"</div>';
  if(n.status==="pending"){
    var sensitive = n.risk==="Sensitive";
    var body='<div class="ndr-draft"><span class="ndr-lab">🤖 Claude draft · grounded, cite-only</span><p>'+esc(n.draft)+'</p></div>'+
      '<p class="ndr-meta"><b>Sources used:</b> '+esc(n.sources)+'</p>'+
      '<p class="ndr-meta">Grounding confidence: <b>'+esc(n.conf)+'</b> · Risk tier: <b>'+esc(n.risk)+'</b>'+(sensitive?' — names a death/allegation, so it needs an <b>editor</b> sign-off before publish':' — auto-eligible; you have the final say')+'</p>';
    var acts='<div class="qact"><button class="btn reject" data-nda="reject:'+n.id+'">Reject</button>'+
      '<button class="btn ghost" data-nda="edit:'+n.id+'">Edit draft</button>'+
      '<button class="btn approve" data-nda="approve:'+n.id+'">'+(sensitive?'Approve (editor)':'Approve &amp; publish')+'</button></div>';
    return '<div class="qcard nd-'+n.tone+'-edge">'+head+post+body+acts+'</div>';
  }
  var share='<div class="ndshare"><div class="ndshare-h">📣 Live on raia · shareable by the public</div>'+
    '<div class="ndshare-b"><span class="ndshare-flag">Debunked · '+esc(n.type)+'</span><p>'+esc(n.draft)+'</p>'+
    '<div class="ndshare-btns"><span class="ndshare-btn x">Share on X</span><span class="ndshare-btn wa">WhatsApp</span><span class="ndshare-btn cp">Copy</span></div></div></div>';
  return '<div class="qcard nd-'+n.tone+'-edge">'+head+post+'<span class="status-tag st-live">on raia</span>'+share+'</div>';
}
function ndAct(a){
  var p=a.split(":"), op=p[0], n=ndById(p[1]); if(!n) return;
  if(op==="approve"){ n.status="published"; state.ndFilter="published";
    PUBLISH.unshift({id:"nd"+Date.now(),source:"Narrative desk",title:"Debunk — "+n.type+" ("+n.platform+")",target:"raia · Truth · shareable card",status:"live",by:"A. Mwangi"});
    toast("Verified → live on raia & shareable"); render(); }
  else if(op==="reject"){ NARR.splice(NARR.indexOf(n),1); toast("Rejected — not published"); render(); }
  else if(op==="edit"){ toast("Edit the draft inline, then approve"); }
}

/* All of a partner's emails: primary + up to two alternates (email_alt, comma-separated). */
function partnerEmails(p){ var a=[p.email]; if(p.email_alt) a=a.concat(String(p.email_alt).split(/[,;\s]+/)); return a.filter(function(e){ return e && /@/.test(e); }); }

/* Match an opportunity to partners by focus-tag overlap, then email them via the notify-partners function. */
function oppMatch(row, wrap, btn){
  var box=wrap.querySelector(".ndr-match"); if(!box) return;
  if(box.innerHTML){ box.hidden=!box.hidden; btn.textContent=box.hidden?"Match & notify":"Hide match"; return; }
  box.hidden=false; btn.textContent="Hide match";
  var bg='margin-top:8px;padding:10px 12px;background:rgba(126,176,216,.10);border-radius:8px;font-size:.82rem;line-height:1.5';
  box.innerHTML='<div style="'+bg+'"><span class="muted">Matching partners…</span></div>';
  ASB.from("partners").select("*").eq("active",true).then(function(res){
    if(res.error){ box.innerHTML='<div style="'+bg+'">Load failed: '+esc(res.error.message)+'</div>'; return; }
    var partners=(res.data||[]).filter(function(p){ return partnerEmails(p).length; });
    if(!partners.length){ box.innerHTML='<div style="'+bg+'">No partners with an email yet — add them under <b>Partners</b> first.</div>'; return; }
    var hay=((row.title||"")+" "+(row.opp_type||"")+" "+(row.eligibility||"")+" "+(row.meta||"")).toLowerCase();
    var scored=partners.map(function(p){ var tags=(p.focus||"").toLowerCase().split(/[,;\s]+/).filter(function(t){return t.length>2;}); var hits=tags.filter(function(t){return hay.indexOf(t)>=0;}); return {p:p,hits:hits}; }).sort(function(a,b){ return b.hits.length-a.hits.length; });
    var html='<div style="'+bg+'"><div style="margin-bottom:6px"><b>Matched partners</b> — tick who to email about "'+esc(row.title)+'":</div>';
    scored.forEach(function(s){ var em=partnerEmails(s.p); html+='<label style="display:block;margin:3px 0"><input type="checkbox" class="mnp" data-email="'+esc(em.join(","))+'" data-name="'+esc(s.p.name||"")+'" '+(s.hits.length?'checked':'')+'> '+esc(s.p.name)+(em.length>1?' <span class="muted">('+em.length+' contacts)</span>':'')+(s.hits.length?' <span style="color:#3FB984">· '+esc(s.hits.join(", "))+'</span>':' <span class="muted">· no tag match</span>')+'</label>'; });
    html+='<button class="btn pub mnsend" type="button" style="margin-top:8px">Send interest email</button> <span class="mnstat muted" style="margin-left:8px"></span></div>';
    box.innerHTML=html;
    var stat=box.querySelector(".mnstat");
    box.querySelector(".mnsend").onclick=function(){ var sbn=box.querySelector(".mnsend"); var mnParts=[].slice.call(box.querySelectorAll(".mnp:checked")).map(function(c){ return {name:c.getAttribute("data-name")||"", emails:(c.getAttribute("data-email")||"").split(",").map(function(e){return e.trim();}).filter(Boolean)}; }).filter(function(p){return p.emails.length;}); if(!mnParts.length){ toast("Pick at least one partner"); return; } sbn.disabled=true; stat.textContent="Sending…";
      ASB.functions.invoke("notify-partners",{ body:{ opportunity:{ title:row.title, opp_type:row.opp_type, deadline:row.deadline, amount:row.amount, by:row.by, eligibility:row.eligibility, url:row.url }, partners:mnParts } }).then(function(r){ sbn.disabled=false;
        if(r.error){ stat.textContent="Failed: "+(r.error.message||r.error); return; }
        var d=r.data||{}; if(d.error){ stat.textContent="Failed: "+(typeof d.error==="string"?d.error:JSON.stringify(d.error)); return; }
        stat.textContent="Sent to "+(d.sent||mnParts.length)+" partner(s)."; toast("Interest email sent to "+(d.sent||mnParts.length)+" partner(s)"); }, function(e){ sbn.disabled=false; stat.textContent="Failed: "+e; }); };
  });
}

/* Auto-match + email focus-matched partners (used when an opportunity is Accepted from review). */
function oppAutoNotify(row){
  if(!ASB) return;
  ASB.from("partners").select("*").eq("active",true).then(function(res){
    if(res.error || !res.data) return;
    var partners=res.data.filter(function(p){ return partnerEmails(p).length; });
    if(!partners.length){ toast("Accepted → live (no partners with emails to notify)"); return; }
    var hay=((row.title||"")+" "+(row.opp_type||"")+" "+(row.eligibility||"")+" "+(row.meta||"")).toLowerCase();
    var matched=partners.filter(function(p){ var tags=(p.focus||"").toLowerCase().split(/[,;\s]+/).filter(function(t){return t.length>2;}); return tags.some(function(t){return hay.indexOf(t)>=0;}); });
    if(!matched.length){ toast("Accepted → live (no partner focus-match to notify)"); return; }
    var mparts=matched.map(function(p){ return {name:p.name, emails:partnerEmails(p)}; });
    ASB.functions.invoke("notify-partners",{ body:{ opportunity:{title:row.title,opp_type:row.opp_type,deadline:row.deadline,amount:row.amount,by:row.by,eligibility:row.eligibility,url:row.url}, partners:mparts } }).then(function(r){
      if(r.error || (r.data&&r.data.error)){ toast("Accepted → live — partner email failed (send manually)"); return; }
      toast("Accepted → live · notified "+((r.data&&r.data.sent)||mparts.length)+" matched partner(s)"); }, function(){ toast("Accepted → live — partner email failed"); });
  });
}

      '<label>Source label (optional)</label><input data-f="source_label" placeholder="Citizen Digital · headline">'+

    '</div></div>';
  var pending='<div class="panel"><div class="sec-title"><h3>Pending review · disinfo scanner drafts</h3><span class="rule"></span></div>'+

function uplSaveDraft(form){ var key=form.getAttribute("data-draft"); if(!key)return; var o={}; form.querySelectorAll("[data-f]").forEach(function(el){ if(el.type==="file")return; o[el.getAttribute("data-f")]=el.value; }); try{ localStorage.setItem(key,JSON.stringify(o)); }catch(e){} }
function uplRestoreDraft(form){ var key=form.getAttribute("data-draft"); if(!key)return; var o; try{ o=JSON.parse(localStorage.getItem(key)||"null"); }catch(e){} if(!o)return; form.querySelectorAll("[data-f]").forEach(function(el){ if(el.type!=="file"&&o[el.getAttribute("data-f")]!=null) el.value=o[el.getAttribute("data-f")]; }); }
function uplClearForm(form){ var key=form.getAttribute("data-draft"); if(key){ try{ localStorage.removeItem(key); }catch(e){} } form.querySelectorAll("[data-f]").forEach(function(el){ if(el.tagName==="SELECT") el.selectedIndex=0; else el.value=""; }); }

function bindUpload(){
  if(state.view!=="upload" || !ASB) return;
  var send=document.getElementById("uplSend");
  if(send) send.addEventListener("click",function(){
    var em=((document.getElementById("uplEmail")||{}).value||"").trim(), msg=document.getElementById("uplAuthMsg");
    if(!/.+@.+\..+/.test(em)){ if(msg) msg.textContent="Enter a valid email."; return; }
    send.disabled=true; if(msg) msg.textContent="Sending…";
    ASB.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}})
      .then(function(r){ send.disabled=false; if(msg) msg.textContent=r.error?("Couldn't send: "+r.error.message):"Check your inbox for the one-time sign-in link."; });
  });
  var out=document.getElementById("uplSignOut");
  if(out) out.addEventListener("click",function(e){ e.preventDefault(); ASB.auth.signOut(); });
  var who=document.getElementById("uplWho");
  if(who) who.addEventListener("click",function(e){ e.preventDefault(); var m=document.getElementById("uplWhoMsg"); if(m){ m.style.color=""; m.textContent="checking…"; }
    ASB.rpc("whoami").then(function(r){ if(!m)return; if(r.error){ m.style.color="#E5625A"; m.textContent="whoami missing — run fix-admin-rls.sql ("+r.error.message+")"; return; } var d=r.data||{}; m.style.color=d.is_admin?"#3FB984":"#E5625A"; m.textContent=" DB sees "+(d.jwt_email||d.meta_email||"(no email in token)")+" · admin="+d.is_admin; }); });
  // draft persistence
  document.querySelectorAll(".upl-form[data-draft]").forEach(function(form){
    uplRestoreDraft(form);
    form.querySelectorAll("[data-f]").forEach(function(el){ if(el.type==="file")return; el.addEventListener("input",function(){ uplSaveDraft(form); }); el.addEventListener("change",function(){ uplSaveDraft(form); }); });
  });
  document.querySelectorAll("[data-clear]").forEach(function(b){ b.addEventListener("click",function(){ var form=b.closest(".upl-form"); uplClearForm(form); var m=form.querySelector(".upl-msg"); if(m){ m.style.color=""; m.textContent="Cleared."; } }); });
  document.querySelectorAll("[data-pub-form]").forEach(function(btn){ btn.addEventListener("click",function(){ publishUpload(btn); }); });
  uplLoadDrafts();
}

function uplLoadDrafts(){
  var host=document.getElementById("uplDrafts"); if(!host||!ASB) return;
  ASB.from("disinfo_items").select("*").eq("published",false).order("created_at",{ascending:false}).then(function(r){
    if(r.error){ host.innerHTML='<p class="muted" style="font-size:.82rem;color:#E5625A">Can\'t load drafts: '+esc(r.error.message)+'</p>'; return; }
    var d=r.data||[];
    if(!d.length){ host.innerHTML='<p class="muted" style="font-size:.82rem">No drafts waiting.</p>'; return; }
    host.innerHTML=d.map(function(i){
      return '<div class="panel" style="margin:0 0 10px;background:#0a1712">'+
        '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b style="font-size:.85rem">'+esc(i.name||i.handle||"Circulating on X")+' <span class="muted" style="font-weight:600">'+esc(i.handle||"")+(i.posted_at?" · "+esc(i.posted_at):"")+'</span></b><span class="muted" style="font-size:.72rem">'+esc(i.verdict||"")+'</span></div>'+
        '<p style="font-size:.85rem;margin:8px 0">"'+esc(i.body||"")+'"</p>'+
        '<p class="muted" style="font-size:.8rem;margin:0 0 8px"><b>Rebuttal:</b> '+esc(i.rebuttal||"")+'</p>'+
        '<div><button class="btn approve" data-draft-pub="'+i.id+'">Publish</button> <button class="btn reject" data-draft-del="'+i.id+'">Discard</button>'+(i.tweet_url?' <a class="btn ghost" href="'+esc(i.tweet_url)+'" target="_blank" rel="noopener noreferrer">View post</a>':'')+'</div>'+
      '</div>';
    }).join("");
    host.querySelectorAll("[data-draft-pub]").forEach(function(b){ b.addEventListener("click",function(){ b.disabled=true; ASB.from("disinfo_items").update({published:true}).eq("id",b.getAttribute("data-draft-pub")).then(function(r){ if(r.error){ b.disabled=false; toast("Publish failed: "+r.error.message); return; } toast("Published to the live desk"); uplLoadDrafts(); }); }); });
    host.querySelectorAll("[data-draft-del]").forEach(function(b){ b.addEventListener("click",function(){ b.disabled=true; ASB.from("disinfo_items").delete().eq("id",b.getAttribute("data-draft-del")).then(function(r){ if(r.error){ b.disabled=false; toast("Discard failed: "+r.error.message); return; } toast("Draft discarded"); uplLoadDrafts(); }); }); });
  });
}

function publishUpload(btn){
  var which=btn.getAttribute("data-pub-form"), form=btn.closest(".upl-form"), msg=form.querySelector(".upl-msg"), row={};
  form.querySelectorAll("[data-f]").forEach(function(el){ if(el.type==="file")return; var v=(el.value||"").trim(); if(v) row[el.getAttribute("data-f")]=v; });
  if(row.date){ row.posted_at=uplFmtDate(row.date); } delete row.date;
  var parts=[]; if(row.reposts) parts.push("↻ "+uplFmtN(row.reposts)); if(row.likes) parts.push("♥ "+uplFmtN(row.likes)); if(row.reach) parts.push("👁 "+uplFmtN(row.reach));
  if(parts.length) row.eng=parts.join(" · "); delete row.reposts; delete row.likes; delete row.reach;
  if(which==="pulse"){ var sel=form.querySelector('[data-f="tag_sector"]'); var label=sel?sel.options[sel.selectedIndex].text:""; row.tag=row.tag_detail?(label+" · "+row.tag_detail):label; row.tag_class=sel?sel.value:""; delete row.tag_detail; delete row.tag_sector; }
  if(row.tweet_url) row.tweet_url=row.tweet_url.replace("://x.com/","://twitter.com/").split("?")[0];
  var table=which==="pulse"?"pulse_items":"disinfo_items";
  var need=which==="pulse"?["tweet_url","handle","body"]:["body","verdict","rebuttal"];
  var miss=need.filter(function(k){ return !row[k]; });
  if(miss.length){ if(msg){ msg.style.color="#E5625A"; msg.textContent="Missing: "+miss.join(", "); } return; }
  btn.disabled=true; if(msg){ msg.style.color=""; msg.textContent="Publishing…"; }
  var fileEl=form.querySelector('[data-f="media"]'), hasFile=fileEl&&fileEl.files&&fileEl.files[0];
  function doInsert(){
    ASB.from(table).insert(row).then(function(r){
      btn.disabled=false;
      if(r.error){ if(msg){ msg.style.color="#E5625A"; msg.textContent="Failed: "+r.error.message+(/(permission|row-level|policy|denied)/i.test(r.error.message||"")?" — click 'check my access' above":""); } return; }
      if(msg){ msg.style.color="#3FB984"; msg.textContent="Published ✓ — live on the next hub load."; }
      uplClearForm(form); if(fileEl) fileEl.value="";
    });
  }
  if(hasFile){
    var f=fileEl.files[0], path=which+"/"+Date.now()+"_"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    if(msg) msg.textContent="Uploading image…";
    ASB.storage.from("media").upload(path,f,{cacheControl:"3600",upsert:false}).then(function(up){
      if(up.error){ btn.disabled=false; if(msg){ msg.style.color="#E5625A"; msg.textContent="Image upload failed: "+up.error.message+" — is the 'media' storage bucket set up?"; } return; }
      try{ row.media_url=ASB.storage.from("media").getPublicUrl(path).data.publicUrl; }catch(e){}
      if(msg) msg.textContent="Publishing…"; doInsert();
    });
  } else { doInsert(); }
}
function subById(id){ for(var i=0;i<SUBMISSIONS.length;i++) if(SUBMISSIONS[i].id===id) return SUBMISSIONS[i]; }
function modAct(a){
  var p=a.split(":"), op=p[0], s=subById(p[1]); if(!s&&op!=="view") return;
  if(op==="approve"){ s.status="approved"; PUBLISH.unshift({id:"pv"+Date.now(),source:"Voices",title:s.name+" — "+s.area,target:"raia · Voices wall",status:"ready",by:"—"}); toast("Approved → sent to publish queue"); render(); }
  else if(op==="reject"){ s.status="rejected"; toast("Rejected"); render(); }
  else if(op==="changes"){ toast("Change request noted to contributor"); }
  else if(op==="reopen"){ s.status="pending"; toast("Reopened for review"); render(); }
  else if(op==="queue"){ PUBLISH.unshift({id:"pv"+Date.now(),source:"Voices",title:s.name+" — "+s.area,target:"raia · Voices wall",status:"ready",by:"—"}); toast("Queued for publishing"); render(); }
  else if(op==="view"){ openReview(s); }
}
function pubById(id){ for(var i=0;i<PUBLISH.length;i++) if(PUBLISH[i].id===id) return PUBLISH[i]; }
function pubAct(a){
  var p=a.split(":"), op=p[0], it=pubById(p[1]); if(!it) return;
  if(op==="pub"){ it.status="live"; it.by="A. Mwangi"; toast("Published to raia"); render(); }
  else if(op==="unpub"){ it.status="ready"; it.by="—"; toast("Unpublished"); render(); }
}
function setFeatured(id){ ISSUES.forEach(function(is){ is.featured = (is.id===id); }); toast("Featured story updated"); render(); }

/* ============================ GATE (prototype) ============================
   Client-side placeholder ONLY — not real security. Production perimeter =
   access control in front of admin.mazingirakenya.org + Supabase Auth (magic-link)
   with the members-table role check. See ADMIN-ACCESS-PROTOCOL.md. */
var GATE_CODE = "deCOAL-2026";           // change here; replaced by real auth at launch
var gateTries = 0;
function gateMsg(m){ var h=document.querySelector(".gate .hint"); if(h){ h.textContent=m; h.style.color="#E5625A"; } }
function showConsole(){
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("shell").classList.add("on");
  render();
}
function unlock(){
  var lockedUntil = +(sessionStorage.getItem("mzk_lock")||0);
  if(Date.now() < lockedUntil){ gateMsg("Too many attempts — wait a minute."); return; }
  var v = (document.getElementById("gcode").value||"").trim();
  if(v !== GATE_CODE){
    gateTries++;
    if(gateTries >= 5){ try{ sessionStorage.setItem("mzk_lock", Date.now()+60000); }catch(e){} gateTries=0; gateMsg("Locked for 1 minute."); }
    else gateMsg("Incorrect code.");
    document.getElementById("gcode").value="";
    return;
  }
  try{ sessionStorage.setItem("mzk_auth","1"); }catch(e){}
  showConsole();
}
document.getElementById("gbtn").addEventListener("click",unlock);
document.getElementById("gcode").addEventListener("keydown",function(e){ if(e.key==="Enter") unlock(); });
document.getElementById("signout").addEventListener("click",function(){
  try{ sessionStorage.removeItem("mzk_auth"); }catch(e){}
  document.getElementById("shell").classList.remove("on");
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("gcode").value="";
});
/* Cross over to the members' hub carrying the admin's Supabase session, so an admin
   (e.g. one who signed in by magic link and never set a password) lands straight in. */
document.getElementById("toHub").addEventListener("click",function(){
  var base="https://hub.mazingirakenya.org/", btn=this;
  if(!ASB || !ASB.auth){ window.open(base,"_blank","noopener"); return; }
  btn.disabled=true;
  ASB.auth.getSession().then(function(r){
    btn.disabled=false;
    var s=r && r.data && r.data.session;
    if(s && s.access_token && s.refresh_token){
      var u=base+"#access_token="+encodeURIComponent(s.access_token)+
        "&refresh_token="+encodeURIComponent(s.refresh_token)+
        "&expires_in="+(s.expires_in||3600)+"&token_type=bearer&type=magiclink";
      window.open(u,"_blank","noopener");
    } else {
      toast("Sign in first (Manual upload → email a magic link), then cross over.");
      window.open(base,"_blank","noopener");
    }
  }, function(){ btn.disabled=false; window.open(base,"_blank","noopener"); });
});
try{ if(sessionStorage.getItem("mzk_auth")==="1") showConsole(); }catch(e){}

if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
    var reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){ if(reloaded) return; reloaded=true; window.location.reload(); });
  });
}
