  a:{en:["Climate change was caused mostly by rich countries that burned coal and oil for a hundred years to get wealthy. But it's poor communities — who burned almost nothing — who suffer first and worst: the herder in Marsabit burying cattle killed by drought, the family in Budalangi flooded out again.",

    "Often the 'somewhere' is community land in northern Kenya — grasslands signed up to carbon projects. The promise is money for communities; the reality is often that outsiders profit, pastoralists lose control of grazing, and the polluter keeps polluting. The useful question is always: who really benefits, and who signed away the use of your land?"],

    "Mara nyingi 'mahali fulani' ni ardhi ya jamii kaskazini mwa Kenya — nyanda zilizoandikishwa kwenye miradi ya kaboni. Ahadi ni pesa kwa jamii; uhalisia mara nyingi ni kwamba wageni wananufaika, wafugaji wanapoteza udhibiti wa malisho, na mchafuzi anaendelea kuchafua. Swali la maana daima ni: nani hasa ananufaika, na nani alisaini kuachia matumizi ya ardhi yako?"]} },

    sh:"Hii ni false choice. Kwa Wakenya wengi, mazingira NDIO uchumi — ardhi, maji, mifugo, uvuvi, tourism. Drought na floods zinacost Kenya mabilioni kwa mwaka, so kupuuza climate kunatufanya maskini zaidi."},
  truth:{en:"Protecting land, water and air is development — not a distraction from it.",sw:"Kulinda ardhi, maji na hewa ni maendeleo — si kizuizi chake.",sh:"Kuprotect ardhi, maji na hewa ni development — si kizuizi."} },
{ id:"d3", verdict:"misleading",

var EXPLAINERS = [
 { id:"eia", q:{en:"EIA & ESIA — the project gatekeeper",sw:"EIA na ESIA — mlinzi wa miradi",sh:"EIA na ESIA — gatekeeper ya projects"},
   a:{en:["An Environmental Impact Assessment (EIA) is a study a developer must do BEFORE a big project — a refinery, dam, road, power or nuclear plant — to predict how it will affect the air, water, land, wildlife and people around it. An ESIA adds the social side: jobs, health, resettlement, culture and livelihoods.","In Kenya, NEMA reviews the study and can approve it, attach conditions, or reject it. By law the public must be consulted — you have the right to read the report and give your views before any approval."],
      sw:["Tathmini ya Athari za Mazingira (EIA) ni utafiti ambao mwekezaji lazima afanye KABLA ya mradi mkubwa — kiwanda cha kusafisha mafuta, bwawa, barabara, kituo cha umeme au nyuklia — kutabiri jinsi utakavyoathiri hewa, maji, ardhi, wanyamapori na watu wa karibu. ESIA huongeza upande wa kijamii: ajira, afya, uhamishaji, utamaduni na maisha.","Nchini Kenya, NEMA hukagua utafiti na yaweza kuidhinisha, kuweka masharti, au kukataa. Kisheria umma lazima ushirikishwe — una haki ya kusoma ripoti na kutoa maoni kabla ya idhini yoyote."],
      sh:["Environmental Impact Assessment (EIA) ni study ambayo developer lazima afanye KABLA ya project kubwa — refinery, dam, barabara, power ama nuclear plant — ku-predict vile itaaffect hewa, maji, ardhi, wanyama na watu wa karibu. ESIA inaongeza social side: jobs, afya, resettlement, culture na livelihoods.","Kenya, NEMA inareview study na inaweza kuapprove, kuweka conditions, ama kureject. Kisheria public lazima ishirikishwe — una right ya kusoma report na kutoa views kabla ya approval yoyote."]},
   steps:[{en:"Developer screens the project and scopes the issues",sw:"Mwekezaji huchuja mradi na kubaini masuala",sh:"Developer anascreen project na anascope issues"},
          {en:"Study predicts impacts on air, water, land and people",sw:"Utafiti hutabiri athari kwa hewa, maji, ardhi na watu",sh:"Study inapredict impacts kwa hewa, maji, ardhi na watu"},
          {en:"Public participation — meetings and written views",sw:"Ushirikishwaji wa umma — mikutano na maoni ya maandishi",sh:"Public participation — meetings na written views"},
          {en:"NEMA reviews and decides: approve, add conditions, or reject",sw:"NEMA hukagua na kuamua: idhinisha, weka masharti, au kataa",sh:"NEMA inareview na inadecide: approve, conditions, ama reject"},
          {en:"Monitoring and audits once it is built",sw:"Ufuatiliaji na ukaguzi mara baada ya kujengwa",sh:"Monitoring na audits ikishajengwa"}],
   why:{en:"No valid EIA/ESIA, no legal project. It is the main moment ordinary people can legally shape — or stop — a harmful development, if they show up and speak.",sw:"Bila EIA/ESIA halali, hakuna mradi halali. Ni wakati mkuu ambao wananchi wa kawaida waweza kisheria kuunda — au kusimamisha — mradi hatari, wakijitokeza na kusema.",sh:"Bila EIA/ESIA halali, hakuna project halali. Ni moment kuu ambapo wananchi wa kawaida wanaweza kisheria kushape — ama kustop — development hatari, wakitokea na kunena."} },
 { id:"impact", q:{en:"How a big project reaches the environment",sw:"Jinsi mradi mkubwa unavyofika mazingira",sh:"Vile project kubwa inafika environment"},
   a:{en:["A single project rarely affects just one thing. Clearing land removes trees and wildlife habitat; construction and traffic foul the air; the plant draws or pollutes water; waste and emissions follow for decades; and nearby families may lose farms, fishing grounds or grazing — sometimes gaining jobs, sometimes not.","Tracing this chain — project to land to water to air to people — is exactly what an EIA/ESIA is meant to do, and what communities should ask about."],
      sw:["Mradi mmoja mara chache huathiri kitu kimoja tu. Kusafisha ardhi huondoa miti na makazi ya wanyama; ujenzi na magari huchafua hewa; kiwanda huchota au kuchafua maji; taka na hewachafu hufuata kwa miongo; na familia za karibu zaweza kupoteza mashamba, uvuvi au malisho — wakati mwingine zikipata ajira, wakati mwingine la.","Kufuatilia mnyororo huu — mradi hadi ardhi hadi maji hadi hewa hadi watu — ndicho EIA/ESIA inapaswa kufanya, na ndicho jamii zinapaswa kuuliza."],
      sh:["Project moja mara chache inaaffect kitu kimoja tu. Kusafisha ardhi inaondoa miti na makao ya wanyama; construction na traffic zinachafua hewa; plant inachota ama inachafua maji; waste na emissions zinafuata kwa decades; na familia za karibu zinaweza kupoteza mashamba, fishing ama grazing — wakati mwingine zikipata jobs, wakati mwingine la.","Kufuatilia hii chain — project hadi ardhi hadi maji hadi hewa hadi watu — ndio EIA/ESIA inafaa kufanya, na ndio communities zinafaa kuuliza."]},
   chain:[{en:"Project",sw:"Mradi",sh:"Project"},{en:"Land",sw:"Ardhi",sh:"Ardhi"},{en:"Water",sw:"Maji",sh:"Maji"},{en:"Air",sw:"Hewa",sh:"Hewa"},{en:"People",sw:"Watu",sh:"Watu"}],
   why:{en:"Benefits are often loud and promised up front; the costs are quiet, spread out, and land on the people nearest the project. Naming the full chain keeps the trade-off honest.",sw:"Faida mara nyingi hupigiwa debe mapema; gharama ni kimya, zimetawanyika, na huwaangukia watu walio karibu zaidi na mradi. Kutaja mnyororo kamili huweka ulinganifu wa haki.",sh:"Benefits mara nyingi ni loud na zinapromisiwa mapema; costs ni kimya, zimespread, na zinaangukia watu wa karibu zaidi na project. Kutaja chain kamili inaweka trade-off honest."} },
 { id:"elnino", q:{en:"El Nino & La Nina — why the weather swings",sw:"El Nino na La Nina — kwa nini hali ya hewa inabadilika",sh:"El Nino na La Nina — kwa nini weather inaswing"},
   a:{en:["El Nino and La Nina are the two phases of a natural warming and cooling of the Pacific Ocean that shifts rainfall across the whole planet. For East Africa, El Nino years often bring heavy rains and floods; La Nina years often bring failed rains and drought.","They are natural cycles — but a hotter climate makes their extremes sharper, so the floods flood harder and the droughts bite deeper."],
      sw:["El Nino na La Nina ni awamu mbili za kuongezeka na kupungua kwa joto kwa Bahari ya Pasifiki ambako huhamisha mvua duniani kote. Kwa Afrika Mashariki, miaka ya El Nino mara nyingi huleta mvua kubwa na mafuriko; miaka ya La Nina mara nyingi huleta mvua kushindwa na ukame.","Ni mizunguko ya asili — lakini tabianchi yenye joto zaidi hufanya ukubwa wao kuwa mkali zaidi, hivyo mafuriko huzidi na ukame huuma zaidi."],
      sh:["El Nino na La Nina ni phases mbili za warming na cooling ya Pacific Ocean inayohamisha mvua dunia nzima. Kwa East Africa, miaka ya El Nino mara nyingi inaleta mvua kubwa na floods; miaka ya La Nina inaleta mvua kushindwa na drought.","Ni natural cycles — lakini climate ya joto zaidi inafanya extremes zao kuwa sharper, so floods zinaflood zaidi na droughts zinauma zaidi."]},
   why:{en:"If you know which phase is coming, you can prepare — plant differently, store water, move livestock. Governments and farmers who ignore the forecast pay for it in lost harvests and lives.",sw:"Ukijua awamu ipi inakuja, waweza kujiandaa — kupanda tofauti, kuhifadhi maji, kuhamisha mifugo. Serikali na wakulima wanaopuuza utabiri hulipa kwa mavuno na maisha yaliyopotea.",sh:"Ukijua phase ipi inakuja, unaweza kuprepare — kupanda differently, kustore maji, kuhamisha mifugo. Serikali na wakulima wanaoignore forecast wanalipa kwa harvests na maisha zilizopotea."} },
 { id:"riftlakes", q:{en:"Why the Rift Valley lakes are rising",sw:"Kwa nini maziwa ya Bonde la Ufa yanapanda",sh:"Kwa nini lakes za Rift Valley zinarise"},
   a:{en:["Since about 2010, lakes like Naivasha, Nakuru, Baringo and Bogoria have swelled, swallowing homes, schools and farms. The main drivers: heavier, more erratic rainfall; silt filling the lake beds and raising water levels; and lost forest and wetland in the catchments upstream, so rain runs off fast instead of soaking in.","Some scientists also point to underground (tectonic) factors in the Rift. Together they push the water out into land people had built on."],
      sw:["Tangu mwaka 2010 hivi, maziwa kama Naivasha, Nakuru, Baringo na Bogoria yamevimba, yakimeza nyumba, shule na mashamba. Visababishi vikuu: mvua nzito na isiyotabirika; mchanga unaojaza vitanda vya maziwa na kupandisha viwango vya maji; na upotevu wa misitu na ardhioevu juu ya mkondo, hivyo mvua hutiririka haraka badala ya kupenya.","Wanasayansi wengine pia hutaja sababu za chini ya ardhi (tectonic) katika Bonde la Ufa. Kwa pamoja husukuma maji nje hadi ardhi watu walikuwa wamejenga."],
      sh:["Tangu around 2010, lakes kama Naivasha, Nakuru, Baringo na Bogoria zimevimba, zikimeza nyumba, shule na mashamba. Drivers kuu: mvua nzito na erratic; silt inayojaza lake beds na kupandisha water levels; na kupoteza forest na wetland kwa catchments za juu, so mvua inarun off fast badala ya kusoak in.","Scientists wengine pia wanapoint kwa underground (tectonic) factors kwa Rift. Pamoja zinasukuma maji nje kwa ardhi watu walikuwa wamejenga."]},
   why:{en:"These are slow-motion disasters that displace thousands quietly. Knowing the causes shows why protecting upstream forests and not building on flood-prone shores matters more than emergency rescue later.",sw:"Haya ni majanga ya polepole yanayohamisha maelfu kimya. Kujua visababishi huonyesha kwa nini kulinda misitu ya juu na kutojenga kwenye fukwe zinazokumbwa na mafuriko ni muhimu zaidi kuliko uokoaji wa dharura baadaye.",sh:"Hizi ni slow-motion disasters zinazodisplace maelfu kimya. Kujua causes inaonyesha kwa nini kuprotect upstream forests na kutojenga kwa flood shores ni muhimu zaidi kuliko emergency rescue baadaye."} },
 { id:"shrink", q:{en:"Why lakes and rivers shrink or vanish",sw:"Kwa nini maziwa na mito hupungua au kutoweka",sh:"Kwa nini lakes na rivers zinashrink ama kutoweka"},
   a:{en:["The opposite problem is just as real. Rivers and lakes shrink when too much water is drawn off upstream for farms, towns and industry; when the forests and wetlands that feed them are cleared; when silt and pollution choke them; and when drought and heat evaporate more than the rains replace.","Once a catchment is degraded, even normal rains no longer refill the system the way they used to."],
      sw:["Tatizo kinyume ni halisi vilevile. Mito na maziwa hupungua wakati maji mengi mno yanachotwa juu kwa mashamba, miji na viwanda; wakati misitu na ardhioevu inayoyalisha inakatwa; wakati mchanga na uchafuzi vinayasonga; na wakati ukame na joto huvukiza zaidi ya mvua inavyojaza.","Mara kondo linapoharibika, hata mvua ya kawaida haijazi tena mfumo jinsi ilivyokuwa."],
      sh:["Opposite problem ni real vilevile. Rivers na lakes zinashrink wakati maji mengi sana yanachotwa upstream kwa mashamba, towns na industry; wakati forests na wetlands zinazozifeed zinakatwa; wakati silt na pollution zinazichoke; na wakati drought na joto zinavaporate zaidi ya vile mvua inajaza.","Catchment ikishaharibika, hata mvua ya kawaida haijazi tena system vile ilikuwa."]},
   why:{en:"Water is the first thing a community loses and the last thing it gets back. Protecting the catchment — the hills, forests and wetlands that hold water — is cheaper than any dam built to replace it.",sw:"Maji ndicho kitu cha kwanza jamii hupoteza na cha mwisho kurudi. Kulinda kondo — vilima, misitu na ardhioevu zinazoshikilia maji — ni nafuu kuliko bwawa lolote lijengwalo kuchukua nafasi yake.",sh:"Maji ndio kitu cha kwanza community inapoteza na cha mwisho kurudi. Kuprotect catchment — hills, forests na wetlands zinazoshika maji — ni cheaper kuliko dam yoyote ya kureplace."} },
 { id:"carbon", q:{en:"Carbon credits — in plain terms",sw:"Mikopo ya kaboni — kwa lugha rahisi",sh:"Carbon credits — kwa lugha rahisi"},

      sw:["Mkopo wa kaboni ni kibali kinachosema tani moja ya gesi inayoongeza joto iliepukwa au kuondolewa — kwa mfano kwa kulinda msitu au kupanda miti. Wachafuzi kwingineko hununua mikopo hii kufidia hewachafu yao.","Wazo laweza kuelekeza pesa kwa jamii zinazolinda asili. Hatari: mikopo isiyowakilisha upunguzaji halisi wa kudumu, au mikataba ambapo jamii hufanya kazi lakini wageni huchukua haki za ardhi na pesa nyingi."],

   why:{en:"Carbon deals are being signed over Kenyan forests and rangelands right now. Communities that understand the terms can demand a fair share and real consent; those that do not can sign away their land for a pittance.",sw:"Mikataba ya kaboni inasainiwa juu ya misitu na malisho ya Kenya sasa hivi. Jamii zinazoelewa masharti zaweza kudai mgao wa haki na ridhaa ya kweli; zisizoelewa zaweza kusaini ardhi yao kwa kidogo.",sh:"Carbon deals zinasainiwa juu ya forests na rangelands za Kenya sasa hivi. Communities zinazoelewa terms zinaweza kudai fair share na real consent; zisizoelewa zinaweza kusign away ardhi yao kwa pittance."} },

var VGAL = (function(){
  var lb, items=[], idx=0;
  function q(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function kindOf(path){ var n=String(path||"").toLowerCase();
    if(/\.(mp4|mov|m4v|webm|3gp|mkv)$/.test(n)) return "video";
    if(/\.(mp3|m4a|aac|wav|ogg|oga|opus|amr|weba)$/.test(n)) return "audio";
    return "image"; }
  function ensure(){
    if(lb) return lb;
    lb=document.createElement("div"); lb.className="vlb"; lb.hidden=true;
    lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true"); lb.setAttribute("aria-label","Media viewer");
    lb.innerHTML='<div class="vlb-stage"></div><button class="vlb-x" aria-label="Close">×</button>'+
      '<button class="vlb-p" aria-label="Previous">‹</button><button class="vlb-n" aria-label="Next">›</button><div class="vlb-c"></div>';
    document.body.appendChild(lb);
    lb.addEventListener("click", function(e){ if(e.target===lb || e.target.classList.contains("vlb-stage")) close(); });
    lb.querySelector(".vlb-x").addEventListener("click", close);
    lb.querySelector(".vlb-p").addEventListener("click", function(){ show(idx-1); });
    lb.querySelector(".vlb-n").addEventListener("click", function(){ show(idx+1); });
    document.addEventListener("keydown", function(e){ if(lb.hidden) return;
      if(e.key==="Escape") close(); else if(e.key==="ArrowLeft") show(idx-1); else if(e.key==="ArrowRight") show(idx+1); });
    return lb;
  }
  function show(i){
    if(!items.length) return; idx=(i+items.length)%items.length; var it=items[idx];
    var st=lb.querySelector(".vlb-stage");
    st.innerHTML = it.k==="video" ? '<video src="'+q(it.u)+'" controls autoplay playsinline></video>' : '<img src="'+q(it.u)+'" alt="">';
    var many=items.length>1;
    lb.querySelector(".vlb-p").style.display = many?"":"none"; lb.querySelector(".vlb-n").style.display = many?"":"none";
    lb.querySelector(".vlb-c").textContent = many ? (idx+1)+" / "+items.length : "";
  }
  function open(list,i){ ensure(); items=list; lb.hidden=false; document.documentElement.style.overflow="hidden"; show(i); lb.querySelector(".vlb-x").focus(); }
  function close(){ if(!lb) return; lb.hidden=true; lb.querySelector(".vlb-stage").innerHTML=""; document.documentElement.style.overflow=""; }
  /* box: container element; signed: [{path, signedUrl}] from createSignedUrls */
  function render(box, signed){
    var vis=[], aud=[];
    (signed||[]).forEach(function(x){ if(!x||!x.signedUrl) return; var k=kindOf(x.path);
      if(k==="audio") aud.push(x.signedUrl); else vis.push({u:x.signedUrl,k:k}); });
    var MAX=6, shown=vis.slice(0,MAX), extra=vis.length-shown.length;
    var n = shown.length>=3 ? 3 : shown.length;
    var html = shown.length ? '<div class="vgal n'+n+'">'+shown.map(function(it,i){
      var more = (extra>0 && i===shown.length-1) ? '<span class="vmore">+'+extra+'</span>' : '';
      var inner = it.k==="video" ? '<video src="'+q(it.u)+'#t=0.5" preload="metadata" muted playsinline></video><span class="vplay"></span>'
                                 : '<img src="'+q(it.u)+'" alt="" loading="lazy">';
      return '<button type="button" class="vt" data-vi="'+i+'" aria-label="Enlarge '+(it.k==="video"?"video":"photo")+'">'+inner+more+'</button>';
    }).join("")+'</div>' : '';
    if(aud.length) html += '<div class="vaud">'+aud.map(function(u){ return '<audio src="'+q(u)+'" controls preload="none"></audio>'; }).join("")+'</div>';
    box.innerHTML = html;
    box.querySelectorAll(".vt").forEach(function(b){ b.addEventListener("click", function(){ open(vis, +b.getAttribute("data-vi")); }); });
  }
  return { render: render, open: open, close: close };
})();

function fetchStream(brand){
  var host=document.getElementById("streamBody"); if(!host) return;
  var empty='<p class="muted" style="padding:0 16px">'+esc(L({en:"Nothing here yet \u2014 check back soon.",sw:"Hakuna bado \u2014 angalia tena.",sh:"Hakuna bado \u2014 check tena."}))+'</p>';
  if(!RSB){ host.innerHTML=empty; return; }
  function fail(){ host.innerHTML=empty; }
  if(brand==="news"){
    RSB.from("sentiment_items").select("source,title,url,stance,published_at,gist").order("published_at",{ascending:false}).limit(30).then(function(r){
      if(r.error||!r.data||!r.data.length){ host.innerHTML=empty; return; }
      host.innerHTML='<div id="streamDigest" style="padding:0 16px"></div>'+
        '<p class="muted" style="padding:0 16px;margin:14px 0 8px;font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em">'+esc(L({en:"Latest headlines",sw:"Vichwa vya habari vya karibuni",sh:"Headlines za saa hii"}))+'</p>'+
        '<div style="display:grid;gap:8px;padding:0 16px">'+r.data.map(radarItem).join("")+'</div>';
      RSB.from("news_digests").select("digest_date,content,sources").eq("published",true).order("digest_date",{ascending:false}).limit(1).then(function(dr){
        var row=dr&&dr.data&&dr.data[0]; if(!row) return;
        var tgt=document.getElementById("streamDigest"); if(tgt) tgt.innerHTML=newsDigestCard(row);
      }, function(){});
    }, fail);
  } else if(brand==="hearsay"){
    RSB.from("disinfo_items").select("*").eq("published",true).order("created_at",{ascending:false}).limit(24).then(function(r){
      if(r.error||!r.data||!r.data.length){ host.innerHTML=empty; return; }
      host.innerHTML='<div style="display:grid;gap:12px;padding:0 16px">'+r.data.map(hearsayCard).join("")+'</div>';
    }, fail);
  } else {
    RSB.from("disinfo_items").select("*").eq("published",true).order("created_at",{ascending:false}).limit(24).then(function(r){
      if(r.error||!r.data){ host.innerHTML=empty; return; }
      var rows=r.data.filter(function(x){ return x.rebuttal; });
      if(!rows.length){ host.innerHTML=empty; return; }
      host.innerHTML='<div style="display:grid;gap:12px;padding:0 16px">'+rows.map(truthCard).join("")+'</div>';
    }, fail);
  }
}

/* ---------- Story of the week: newest published row in weekly_stories ----------
   Either an AI-drafted, admin-approved story for the week (shown in raia's issue format), or an
   admin's pick of an existing issue (issue_id). Falls back to the issue marked featured in code. */
var WEEKLY = { done:false };
function applyWeekly(row){
  if(!row) return false;
  ISSUES = ISSUES.filter(function(x){ return !x.weekly; });
  if(row.issue_id){
    if(!issueById(row.issue_id)) return false;
    ISSUES.forEach(function(x){ x.featured = (x.id===row.issue_id); });
    return true;
  }
  var st=row.story||{};
  if(!st.title||!st.title.en) return false;
  var wk={ id:"week-"+row.week_of, weekly:true, week_of:row.week_of, featured:true,
    status: STATUS[st.status]?st.status:"new",
    place: st.place||{en:""}, title: st.title, summary: st.summary||{en:""},
    happening: st.happening||{en:[]}, narrative: st.narrative||{en:[]}, gap: st.gap||{en:[]},
    action: st.action||{en:""}, sources: row.sources||[],
    related: [] };
  ISSUES.forEach(function(x){ x.featured=false; });
  ISSUES.unshift(wk);
  return true;
}
function fetchWeekly(){
  if(!RSB||WEEKLY.done) return;
  WEEKLY.done=true;
  RSB.from("weekly_stories").select("week_of,issue_id,story,sources").eq("published",true)
    .order("week_of",{ascending:false}).order("updated_at",{ascending:false}).limit(1)
    .then(function(r){
      var row=r&&r.data&&r.data[0];
      if(applyWeekly(row) && (state.view==="ninini"||state.view==="issue")) render();
    }, function(){});
}
function weekLabel(d){ try{ return new Date(d+"T00:00:00").toLocaleDateString(LANG==="en"?"en-GB":"sw-KE",{day:"numeric",month:"short"}); }catch(e){ return d; } }

/* plain or lightly-marked-up text → readable paragraphs and headings */
function petParas(t){
  t=dec(String(t||"")).replace(/\r/g,"").trim(); if(!t) return [];
  var parts=t.split(/\n\s*\n/);
  if(parts.length===1 && t.length>900) parts=t.split(/\n/);
  return parts.map(function(par){
    par=par.trim(); if(!par) return null;
    var md=par.match(/^#{1,4}\s+([\s\S]*)$/);
    var plain=par.replace(/\*\*/g,"");
    var head=!!md || (plain.length<110 && plain.indexOf("\n")<0 && /[A-Z]/.test(plain) && plain===plain.toUpperCase());
    return { head:head, text:md?md[1].replace(/\*\*/g,""):par };
  }).filter(Boolean);
}
function petBodyHtml(t){
  return petParas(t).map(function(x){
    if(x.head) return '<h4 style="margin:18px 0 6px;font-size:.98rem;line-height:1.35">'+esc(x.text.replace(/\*\*/g,""))+'</h4>';
    var h=esc(x.text).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
    return '<p style="margin:0 0 12px;line-height:1.6">'+h+'</p>';

}

/* --- downloads: PDF (jsPDF, loaded on demand) and Word --- */
function petLoadPdfLib(){
  if(window.jspdf) return Promise.resolve();
  if(PETS.pdfLoading) return PETS.pdfLoading;
  PETS.pdfLoading=new Promise(function(res,rej){
    var s=document.createElement("script"); s.src=JSPDF_SRC; s.async=true;
    s.onload=function(){ res(); }; s.onerror=function(){ PETS.pdfLoading=null; rej(); };
    document.head.appendChild(s);
  });
  return PETS.pdfLoading;
}
/* the built-in PDF fonts cover Latin-1 only, so map typographic marks and drop the rest */
function pdfSafe(s){
  return dec(String(s||"")).replace(/[\u2018\u2019\u201A\u2032]/g,"'").replace(/[\u201C\u201D\u201E\u2033]/g,'"')
    .replace(/[\u2013\u2014\u2212]/g,"-").replace(/\u2026/g,"...").replace(/[\u2022\u25CF\u25AA]/g,"-").replace(/\u00A0/g," ")
    .replace(/[^\x09\x0A\x0D\x20-\x7E\u00A1-\u00FF]/g,"");
}
function petPdfBlob(p){
  var doc=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
  var W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), m=56, lw=W-2*m, y=m;
  function ensure(h){ if(y+h>H-m-20){ doc.addPage(); y=m; } }
  function block(text,size,style,gap,rgb){
    doc.setFont("helvetica",style||"normal"); doc.setFontSize(size); var c=rgb||[21,22,26]; doc.setTextColor(c[0],c[1],c[2]);
    var lines=doc.splitTextToSize(pdfSafe(text),lw), lh=size*1.4;
    lines.forEach(function(l){ ensure(lh); doc.text(l,m,y+size); y+=lh; }); y+=(gap||0);
  }
  block("MAZINGIRAKENYA RAIA  -  PETITIONS & MEMORANDA",8,"bold",10,[154,106,6]);
  block(p.title,18,"bold",8);
  block("To: "+(p.target||""),10.5,"normal",2,[88,85,73]);
  if(p.deadline) block("Deadline: "+p.deadline,10.5,"normal",2,[88,85,73]);
  if(p.source_name) block("Posted by: "+p.source_name,10.5,"normal",2,[88,85,73]);
  y+=8; block(p.summary,11.5,"bold",10);
  doc.setDrawColor(220,154,24); doc.setLineWidth(1.2); ensure(10); doc.line(m,y,W-m,y); y+=16;
  var paras=petParas(p.body); if(!paras.length) paras=[{head:false,text:p.summary}];
  paras.forEach(function(x){ var t=x.text.replace(/\*\*/g,""); if(x.head){ y+=4; block(t,11.5,"bold",4); } else block(t,10.5,"normal",8); });
  y+=10;
  block(petIsExt(p)?"Take action: "+p.action_url:"Read and add your name: "+petUrl(p),10,"bold",2,[27,122,62]);
  var n=doc.internal.getNumberOfPages();
  for(var i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(120,120,120);
    doc.text("MazingiraKenya Raia - "+location.host,m,H-30); doc.text(i+" / "+n,W-m,H-30,{align:"right"}); }
  return doc.output("blob");
}

    '<p class="k">MAZINGIRAKENYA RAIA · PETITIONS &amp; MEMORANDA</p><h1>'+esc(dec(p.title))+'</h1>'+
    '<p class="m">To: '+esc(dec(p.target))+(p.deadline?'<br>Deadline: '+esc(p.deadline):'')+(p.source_name?'<br>Posted by: '+esc(dec(p.source_name)):'')+'</p>'+

function petDownload(blob,name){
  var a=document.createElement("a"), u=URL.createObjectURL(blob); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },4000);
}
function bindPetDocs(host,p){
  var pdf=host.querySelector(".petpdf"), word=host.querySelector(".petword"), sh=host.querySelector(".petsharedoc");
  var base="Petition-"+petSlug(p);
  function busy(b,on,txt){ b.disabled=on; if(txt) b.textContent=txt; }
  if(pdf) pdf.addEventListener("click",function(){
    var t=pdf.textContent; busy(pdf,true,L({en:"Preparing…",sw:"Inaandaa…",sh:"Inaprepare…"}));
    petLoadPdfLib().then(function(){ petDownload(petPdfBlob(p),base+".pdf"); busy(pdf,false,t); },
      function(){ busy(pdf,false,L({en:"PDF unavailable — try Word",sw:"PDF haipatikani — jaribu Word",sh:"PDF haipatikani — try Word"})); });
  });
  if(word) word.addEventListener("click",function(){ petDownload(petWordBlob(p),base+".doc"); });
  if(sh) sh.addEventListener("click",function(){
    /* share the PDF file itself where the phone allows it (WhatsApp, Telegram, email…);
       otherwise download it so it can be attached by hand */
    if(window.jspdf && navigator.canShare && typeof File==="function"){
      var f=new File([petPdfBlob(p)],base+".pdf",{type:"application/pdf"});
      if(navigator.canShare({files:[f]})){ navigator.share({files:[f],title:dec(p.title),text:petShareText(p)+" "+petUrl(p)}).catch(function(){}); return; }
    }
    if(navigator.share){ navigator.share({title:dec(p.title),text:petShareText(p),url:petUrl(p)}).catch(function(){}); return; }
    petLoadPdfLib().then(function(){ petDownload(petPdfBlob(p),base+".pdf"); sh.textContent=L({en:"Downloaded — attach it to share",sw:"Imepakuliwa — iambatanishe kushiriki",sh:"Imedownload — iattach ushare"}); }, function(){});
  });
}

/* ============================ LIVE TICKER ============================ */
/* What's current on raia, running across the top: petitions to sign, fresh fact-checks,
   headlines and what's coming up. Built from the same public tables the pages use. */
var TK = { petitions:[], checks:[], news:[], events:[], lang:null, timer:null };
function tkLoad(){
  if(!RSB) return;
  var today=new Date().toISOString().slice(0,10), pending=4;
  function one(){ if(--pending===0) tkPaint(true); }
  petsLoad(function(rows){ TK.petitions=(rows||[]).slice(0,6); one(); });
  RSB.from("disinfo_items").select("*").eq("published",true).order("created_at",{ascending:false}).limit(8).then(function(r){ TK.checks=((r&&r.data)||[]).filter(function(x){ return x.rebuttal; }).slice(0,4); one(); }, one);
  RSB.from("sentiment_items").select("title,url,source,published_at").order("published_at",{ascending:false}).limit(5).then(function(r){ TK.news=(r&&r.data)||[]; one(); }, one);
  RSB.from("calendar_events").select("id,title,start_date,location,link").eq("published",true).gte("start_date",today).order("start_date",{ascending:true}).limit(3).then(function(r){ TK.events=(r&&r.data)||[]; one(); }, one);
}
function tkClip(s,n){ s=dec(String(s||"")).replace(/\s+/g," ").trim(); return s.length>n?s.slice(0,n-1)+"…":s; }
function tkItem(cat,color,text,attrs){
  return '<a class="rtick-item" '+attrs+'><span class="rtick-cat" style="color:'+color+'">'+esc(cat)+'</span>'+esc(text)+'</a>';
}
function tkPaint(force){
  var tr_=document.getElementById("rtickTrack"), bar=document.getElementById("rtick"); if(!tr_||!bar) return;
  if(!force && TK.lang===LANG) return;
  TK.lang=LANG;
  var items=[];
  TK.petitions.forEach(function(p){
    var n=p.sign_count||0, tail=petIsExt(p)?L({en:"take action",sw:"chukua hatua",sh:"chukua action"}):(n?n.toLocaleString()+" "+L({en:"signed",sw:"wametia sahihi",sh:"wame-sign"}):L({en:"be the first to sign",sw:"kuwa wa kwanza kutia sahihi",sh:"kuwa wa kwanza ku-sign"}));
    items.push(tkItem(L({en:"Petition",sw:"Ombi",sh:"Petition"}),"#F0B93E",tkClip(p.title,80)+" — "+tail,'href="#petition='+encodeURIComponent(p.id)+'"'));
  });
  TK.checks.forEach(function(i){ items.push(tkItem(L({en:"Fact-check",sw:"Uhakiki",sh:"Fact-check"}),"#FF6B6B",(tr(i,"verdict")?tr(i,"verdict")+": ":"")+tkClip(tr(i,"body"),80),'href="#disinfo/'+esc(i.id)+'"')); });
  TK.news.forEach(function(i){ if(i.title) items.push(tkItem(L({en:"In the news",sw:"Habarini",sh:"Kwa news"}),"#7FD1A0",tkClip(i.title,90)+(i.source?" · "+tkClip(i.source,24):""),'href="'+esc(i.url||"#")+'" target="_blank" rel="noopener noreferrer"')); });
  TK.events.forEach(function(i){
    var d=i.start_date?new Date(i.start_date+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";
    items.push(tkItem(L({en:"Coming up",sw:"Inakuja",sh:"Inakuja"}),"#9EC5FF",(d?d+" · ":"")+tkClip(i.title,70),i.link?'href="'+esc(i.link)+'" target="_blank" rel="noopener noreferrer"':''));
  });
  ISSUES.filter(function(x){ return x.status==="ongoing"||x.status==="threat"; }).slice(0,3).forEach(function(x){
    items.push(tkItem(L({en:"Ni Nini?",sw:"Ni Nini?",sh:"Ni Nini?"}),"#F0B93E",tkClip(L(x.title),80),'href="#" data-tk-issue="'+esc(x.id)+'"'));
  });
  if(!items.length){ bar.hidden=true; return; }
  /* mix the kinds so one source doesn't run in a block */
  var mixed=[], buckets={}; items.forEach(function(h){ var k=h.match(/rtick-cat" style="color:([^"]+)"/)[1]; (buckets[k]=buckets[k]||[]).push(h); });
  var keys=Object.keys(buckets), left=items.length; while(left>0){ keys.forEach(function(k){ if(buckets[k].length){ mixed.push(buckets[k].shift()); left--; } }); }
  tr_.innerHTML=mixed.join("")+mixed.join("");
  tr_.style.setProperty("--rdur",Math.max(60,mixed.length*7)+"s");
  document.getElementById("rtickLabel").textContent=L({en:"Live",sw:"Sasa hivi",sh:"Live"});
  bar.hidden=false;
  tr_.querySelectorAll("[data-tk-issue]").forEach(function(a){ a.addEventListener("click",function(e){ e.preventDefault(); openIssue(a.getAttribute("data-tk-issue")); }); });
}
function tkStart(){
  var bar=document.getElementById("rtick"); if(!bar) return;
  bar.addEventListener("click",function(e){ if(e.target.closest(".rtick-tag")) bar.classList.toggle("paused"); });
  /* a link to the hash you're already on doesn't fire hashchange — re-apply it */
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#petition"],a[href^="#disinfo/"]'); if(!a) return;
    if(location.hash===a.getAttribute("href")){ e.preventDefault(); applyHash(true); }
  });
  tkLoad();
  TK.timer=setInterval(function(){ if(!document.hidden){ PETS.at=0; tkLoad(); } },300000);
}

  POLL[choice]=(POLL[choice]||0)+1; POLL.voted=choice;
  try{ localStorage.setItem("raia.poll."+POLL.key,choice); }catch(e){}
  if(RSB){ RSB.from("poll_votes").insert({poll_key:POLL.key,choice:choice}).then(function(){},function(){}); }
  render();
}

/* Deep-link: #lie or #lie/<id> opens the "Spot the lie" feed (from the hub's "View full post"). */
function applyHash(scroll){
  var h=(location.hash||"").replace(/^#/,"");
  if(h==="lie"||h.indexOf("lie/")===0){
    var id=h.indexOf("lie/")===0?h.slice(4):"";
    state.view="learn"; state.learnTab="d"; state.focusLie=id||null; render();
    if(id){ var el=document.getElementById("lie-"+id); if(el){ el.scrollIntoView({behavior:scroll?"smooth":"auto",block:"start"}); el.classList.add("flash"); } }
    return true;
  }
  if(h.indexOf("disinfo/")===0){
    state.disinfoId=h.slice(8).replace(/[^0-9]/g,""); state.view="disinfo"; render(); return true;
  }
  if(h==="petitions"){ state.view="petitions"; state.petitionId=null; render(); return true; }
  if(h==="cop31"||h==="cop"){ state.view="cop"; render(); return true; }
  if(h.indexOf("petition=")===0){ state.petitionId=decodeURIComponent(h.slice(9)); state.view="petition"; render(); return true; }
  if(h.indexOf("flag/")===0){
    var parts=h.slice(5).split("/");
    state.flagPost=(parts[0]||"").replace(/[^0-9]/g,"");
    state.flagVerdict=parts[1]?decodeURIComponent((parts[1]||"").replace(/\+/g," ")):"";
    state.view="flag"; render(); return true;
  }
  return false;
}
