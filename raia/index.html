<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raia · MazingiraKenya</title>
<meta name="description" content="Kenya's climate & environmental justice, in everyday language — the news, how it's talked about, and the fuller picture. English, Swahili, Sheng.">
<meta name="theme-color" content="#15161A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,600&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315161A'/%3E%3Ctext x='31' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23F6EFDD'%3EM%3C/text%3E%3Ccircle cx='48' cy='18' r='6' fill='%23DC9A18'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#FAF6EC; --paper2:#F0E7D4; --card:#FFFFFF;
  --ink:#15161A; --ink-2:#24262E; --ink-soft:#585549;
  --cream:#F6EFDD;
  --red:#C0202A; --red-ink:#A5121C;
  --green:#0C7A4D; --green-ink:#0A5E3B;
  --gold:#DC9A18; --gold-2:#F0B93E;
  --news:#2C4B59;
  --line:#E7DCC4;
  --shadow:0 1px 2px rgba(20,16,4,.05), 0 8px 22px rgba(20,16,4,.06);
  --shadow-lg:0 14px 40px rgba(20,16,4,.14);
  --wrap:1120px; --read:730px; --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}html{background:var(--paper)}
body{background:radial-gradient(1100px 620px at 100% -8%, rgba(220,154,24,.14), transparent 55%), radial-gradient(1000px 580px at -6% 102%, rgba(12,122,77,.11), transparent 55%), radial-gradient(900px 520px at 50% 40%, rgba(192,32,42,.05), transparent 60%), var(--paper);background-attachment:fixed;color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Lora",Georgia,serif;line-height:1.16;margin:0 0 .35em;font-weight:700;letter-spacing:-.012em}
p{margin:0 0 .92em}
a{color:var(--green-ink);text-decoration:none;font-weight:700}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.reading{max-width:var(--read);margin:0 auto}
.muted{color:var(--ink-soft)}
.overflow-anywhere{overflow-wrap:anywhere}
.flagbar{height:4px;background:linear-gradient(90deg,var(--ink) 0 25%,var(--red) 25% 50%,var(--green) 50% 75%,var(--gold) 75% 100%)}

/* kicker (clean, no sticker) */
.k{display:inline-block;font-weight:900;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.k.news{color:var(--news)} .k.hearsay{color:var(--red-ink)} .k.truth{color:var(--green-ink)} .k.learn{color:#9a6a06} .k.gold{color:#9a6a06}

/* ---------- top bar + desktop nav ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--ink)}
.topbar .row{display:flex;align-items:center;gap:14px;height:58px;max-width:var(--wrap);margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:2px;font-family:"Lora",serif;font-weight:700;font-size:1.16rem;color:var(--cream);white-space:nowrap}
.brand b{color:var(--gold-2)} .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin:-9px 0 0 1px}
.desknav{display:none;gap:3px;margin-left:6px}
.desknav button{border:0;background:transparent;color:#d3c9af;font-weight:800;font-size:.86rem;padding:8px 12px;border-radius:9px;position:relative}
.desknav button:hover{color:var(--cream);background:rgba(255,255,255,.06)}
.desknav button[aria-current="true"]{color:#fff}
.desknav button[aria-current="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2.5px;border-radius:3px;background:var(--gold)}
.langs{margin-left:auto;display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;gap:2px}
.langs button{border:0;background:transparent;color:#c6bba1;font-weight:900;font-size:.73rem;letter-spacing:.03em;padding:6px 10px;border-radius:999px;min-width:40px}
.langs button[aria-pressed="true"]{background:var(--gold);color:#3a2a00}

main{padding-top:22px}
.view{animation:fade .24s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* ---------- hero ---------- */
.hero{position:relative;background:radial-gradient(120% 130% at 85% -10%, #223 0%, var(--ink) 55%);color:var(--cream);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero .pad{padding:26px 22px 28px}
.hero-grid{display:grid;gap:22px}
.hero .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.hero .eyebrow .badge{font-weight:900;letter-spacing:.04em;background:var(--gold);color:#3a2a00;font-size:.72rem;padding:4px 9px;border-radius:6px}
.hero .eyebrow .txt{font-size:.8rem;font-weight:800;color:#c6bba1;letter-spacing:.02em}
.hero h1{font-size:3.1rem;color:#fff;margin:0 0 .1em;line-height:.98;letter-spacing:-.02em}
.hero h1 .q{color:var(--gold-2)}
.hero .lede{font-size:1.14rem;color:#EDE4CE;margin:8px 0 0;font-weight:700}
.hero .lede .mark{background:linear-gradient(transparent 60%, rgba(220,154,24,.5) 60%);padding:0 2px}
.hero .about{font-size:.96rem;color:#C7BCA2;margin:14px 0 0;max-width:52ch}
.snav{display:grid;gap:9px}
.snav button{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-radius:13px;padding:12px 14px;color:#fff;transition:transform .16s, background .16s,border-color .16s;width:100%}
.snav button:hover{background:rgba(255,255,255,.1);transform:translateX(3px);border-color:rgba(255,255,255,.28)}
.snav .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.snav .body{flex:1;min-width:0}
.snav .t{font-weight:800;font-size:.98rem;line-height:1.15}
.snav .s{font-size:.76rem;color:#c3b89e;font-weight:600}
.snav .arw{color:#8f856d;font-weight:900}
.d-news{background:var(--news)}.d-hearsay{background:var(--red)}.d-truth{background:var(--green)}.d-learn{background:var(--gold)}

/* section head */
.shead{display:flex;align-items:center;gap:12px;margin:30px 2px 14px}
.shead h2{font-size:1.32rem;margin:0}
.shead .rule{flex:1;height:2px;background:var(--line);border-radius:3px}

/* ---------- cards / grid ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;transition:transform .16s, box-shadow .16s, border-color .16s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#dccda6}
.card .accent{height:4px}
.card .in{padding:16px 17px}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.card h3{font-size:1.16rem;margin:0 0 .3em}
.card .sum{font-size:.92rem;color:var(--ink-soft);margin:0}
.a-news{background:var(--news)}.a-hearsay{background:var(--red)}.a-truth{background:var(--green)}.a-learn{background:var(--gold)}.a-mixed{background:linear-gradient(90deg,var(--news) 0 33%,var(--red) 33% 66%,var(--green) 66% 100%)}.a-new{background:var(--gold)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid}
.chip.win{background:#E7F4EC;color:#0A5A3A;border-color:#9ecdb4}
.chip.new{background:#FBF0D6;color:#8A5B00;border-color:var(--gold)}
.chip.ongoing{background:#FCEEDA;color:#9A5A05;border-color:#e3b877}
.chip.threat{background:#FBE3E1;color:#A5121C;border-color:#e8a29c}
.chip.proposed{background:#EEE7D6;color:#5B5138;border-color:#cdbe93}
.chip.decided{background:#E7EEF2;color:#2C4B59;border-color:#a9c1cc}
.place{font-size:.78rem;font-weight:800;color:var(--ink-soft)}

/* featured */
.featured{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lg);cursor:pointer;transition:transform .16s}
.featured:hover{transform:translateY(-2px)}
.featured .ribbon{background:linear-gradient(90deg,var(--gold),var(--gold-2));color:#3a2a00;padding:8px 16px;font-weight:900;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.featured .fg{display:grid;gap:0}
@media(min-width:820px){.featured .fg{grid-template-columns:1.35fr .9fr}}
.featured .pad{padding:20px}
.featured h2{font-size:1.92rem;margin:.12em 0 .34em;line-height:1.08}
.featured .sum{color:var(--ink-soft);margin:0 0 14px;font-size:1.02rem}
.featured .aside{background:var(--paper);border-top:1px solid var(--line);padding:18px 20px}
@media(min-width:820px){.featured .aside{border-top:0;border-left:1px solid var(--line)}}
.featured .aside .lab{font-size:.68rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px}
.lensrow{display:flex;flex-direction:column;gap:9px}
.lenspill{display:flex;align-items:center;gap:9px;font-weight:800;font-size:.9rem}
.lenspill .dot{width:9px;height:9px;border-radius:50%}

/* ---------- stream landing ---------- */
.streamhero{position:relative;color:#fff;border-radius:20px;padding:26px 22px;margin-bottom:6px;box-shadow:var(--shadow-lg);overflow:hidden}
.streamhero.news{background:radial-gradient(120% 120% at 90% -20%,#2c2f38,var(--ink))}
.streamhero.hearsay{background:radial-gradient(120% 120% at 90% -20%,#C0202A,#7d1218)}
.streamhero.truth{background:radial-gradient(120% 120% at 90% -20%,#0C7A4D,#064a2d)}
.streamhero.learn{background:radial-gradient(120% 120% at 90% -20%,#e0a721,#9a6a06);color:#2a1e00}
.streamhero.voices{background:radial-gradient(125% 120% at 88% -10%,#0C7A4D,var(--ink))}
.streamhero .eye{font-weight:900;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.95}
.streamhero h1{color:inherit;font-size:2.05rem;margin:6px 0 .16em;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.streamhero.learn h1{text-shadow:none}
.streamhero p{margin:0;opacity:1;font-weight:600;font-size:.98rem;max-width:60ch;text-shadow:0 1px 2px rgba(0,0,0,.22)}
.streamhero.learn p{text-shadow:none}

/* ---------- issue detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font-weight:900;font-size:.86rem;padding:6px 0;margin-bottom:6px}
.back:hover{color:var(--green-ink)}
.issue-head h1{font-size:1.9rem;margin:.18em 0 .42em}
.issue-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:5px;background:var(--paper2);border-radius:13px;padding:5px;margin:18px 0 2px;position:sticky;top:58px;z-index:20}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink-soft);font-weight:900;font-size:.78rem;padding:10px 4px;border-radius:9px;line-height:1.14;transition:background .15s,color .15s}
.tabs button[data-lens="happening"]{color:var(--news)}
.tabs button[data-lens="narrative"]{color:var(--red-ink)}
.tabs button[data-lens="gap"]{color:var(--green-ink)}
.tabs button:hover{filter:brightness(.82)}
.tabs button[aria-selected="true"]{color:#fff;filter:none}
.tabs button[data-lens="happening"][aria-selected="true"]{background:var(--news)}
.tabs button[data-lens="narrative"][aria-selected="true"]{background:var(--red)}
.tabs button[data-lens="gap"][aria-selected="true"]{background:var(--green)}
.lens-panel{padding:18px 0 2px;font-size:1.05rem}
.lens-panel .k{margin-bottom:12px}
.actionbox{border-radius:15px;padding:17px 18px;margin:20px 0 6px;background:var(--ink);color:var(--cream)}
.actionbox .k{margin-bottom:8px;color:var(--gold-2)}
.actionbox p{margin:0;font-weight:700;color:#fff}
.related{margin:18px 0}
.related .lab{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:9px}
.tagrow{display:flex;flex-wrap:wrap;gap:9px}
.tag{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.84rem;font-weight:800;color:var(--ink);transition:border-color .15s,transform .12s}
.tag:hover{border-color:var(--green);transform:translateY(-1px)}
.tag::before{content:"?";display:inline-block;margin-right:6px;color:var(--green-ink);font-weight:900}
.tag.myth::before{content:"!";color:var(--red-ink)}
.fallback-note{font-size:.74rem;color:var(--ink-soft);background:var(--paper2);border-radius:7px;padding:5px 10px;display:inline-block;margin-bottom:11px;font-weight:700}

/* ---------- learn ---------- */
.seg{display:flex;gap:5px;background:var(--paper2);border-radius:13px;padding:5px;margin:16px 0 16px;position:sticky;top:58px;z-index:20}
.seg button{flex:1;border:0;background:transparent;color:var(--ink-soft);font-weight:900;font-size:.88rem;padding:11px;border-radius:9px;transition:.15s}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.acc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:13px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;transition:box-shadow .15s}
.acc.myth{border-left-color:var(--red)}
.acc:hover{box-shadow:var(--shadow-lg)}
.acc > button{width:100%;text-align:left;background:none;border:0;padding:16px 17px;display:flex;gap:12px;align-items:flex-start}
.acc .q{flex:1;font-family:"Lora",serif;font-weight:700;font-size:1.1rem;color:var(--ink)}
.acc .qmyth{flex:1;font-weight:800;font-size:1.02rem;color:var(--ink);font-style:italic}
.acc .plus{color:var(--green-ink);font-weight:900;font-size:1.45rem;line-height:1;transition:transform .2s}
.acc.myth .plus{color:var(--red-ink)}
.acc.open .plus{transform:rotate(45deg)}
.acc .panel{padding:0 17px 17px;display:none;font-size:1rem}
.acc.open .panel{display:block}
.myth-row{margin:12px 0}
.myth-row .lab{font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;display:inline-block;margin-bottom:4px;padding:3px 8px;border-radius:5px}
.myth-row.reality .lab{background:var(--green);color:#fff}.myth-row.why .lab{background:var(--paper2);color:#7a5a12}.myth-row.where .lab{background:var(--paper2);color:var(--ink-soft)}
.myth-row.reality p{font-weight:700}
/* Know & Understand — wider, two columns on desktop */
.seg{max-width:660px}
.seg button{font-size:.8rem;line-height:1.12}
.learn-grid{display:grid;gap:12px}
@media(min-width:840px){ .learn-grid{grid-template-columns:1fr 1fr;align-items:start} }
/* disinformation cards */
.dcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:15px 16px}
.dcard.v-false{border-left-color:#C0202A}.dcard.v-mis{border-left-color:#DC9A18}.dcard.v-miss{border-left-color:#2C4B59}.dcard.v-manip{border-left-color:#B4531A}
.dtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.verdict{font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:#fff}
.verdict.v-false{background:#C0202A}.verdict.v-mis{background:#DC9A18;color:#3a2a00}.verdict.v-miss{background:#2C4B59}.verdict.v-manip{background:#B4531A}
.dwhere{font-size:.7rem;font-weight:800;color:var(--ink-soft)}
.dclaim{font-family:"Lora",serif;font-weight:600;font-style:italic;font-size:1.06rem;color:var(--ink);margin:0 0 11px}
.dlab{font-size:.63rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;display:inline-block;margin-bottom:3px;padding:2px 8px;border-radius:5px}
.dlab.bad{background:#FBE3E1;color:#A5121C}.dlab.good{background:#E7F4EC;color:#0A5A3A}
.drow p{margin:0 0 11px}
.dtrue{background:var(--paper2);border-radius:10px;padding:10px 12px;font-weight:700}
.dtrue .dlab{margin-bottom:0;margin-right:5px}
.dsrc{margin:10px 0 0}
.dsrc a{font-size:.8rem;font-weight:800;color:var(--green-ink)}
/* visual "spot the lie" post cards — the lie is seen, then debunked */
.lie{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.lie.v-false{border-left-color:#C0202A}.lie.v-mis{border-left-color:#DC9A18}.lie.v-miss{border-left-color:#2C4B59}.lie.v-manip{border-left-color:#B4531A}
.lie.flash{animation:lieflash 1.4s ease}
@keyframes lieflash{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 3px var(--gold)}}
.lp-head{display:flex;align-items:center;gap:10px;padding:13px 14px 0}
.lp-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.05rem;color:#fff;flex:0 0 auto}
.lp-av.x{background:#0b0b0b}.lp-av.tiktok{background:#0b0b0b;color:#25F4EE}.lp-av.fb{background:#1b4a9c}.lp-av.wa{background:#128C7E}.lp-av.radio{background:#5a4633}
.lp-who{min-width:0;line-height:1.24}
.lp-who b{display:block;font-size:.92rem;color:var(--ink)}
.lp-who span{font-size:.72rem;color:var(--ink-soft);font-weight:700;overflow-wrap:anywhere}
.lp-body{position:relative;padding:11px 14px 14px}
.lp-text{font-family:"Lora",serif;font-weight:600;font-style:italic;font-size:1.12rem;line-height:1.45;color:var(--ink);margin:0;padding-right:92px}
.lp-stamp{position:absolute;top:8px;right:12px;font-weight:900;font-size:.8rem;letter-spacing:.03em;text-transform:uppercase;color:#fff;padding:6px 11px;border-radius:8px;transform:rotate(5deg);box-shadow:0 3px 10px rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.82)}
.lp-stamp.v-false{background:#C0202A}.lp-stamp.v-mis{background:#DC9A18;color:#3a2a00}.lp-stamp.v-miss{background:#2C4B59}.lp-stamp.v-manip{background:#B4531A}
.lie-debunk{background:var(--paper2);border-top:1px solid var(--line);padding:14px}
.lie-debunk .drow p{margin:0 0 11px}
.lie-debunk .dtrue{background:var(--card)}
.lie-intro{font-weight:800;color:var(--ink-soft);margin:2px 0 12px;font-size:.95rem}
.lie-backhub{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;font-weight:900;font-size:.85rem;padding:10px 16px;border-radius:999px;margin:0 0 12px;text-decoration:none;box-shadow:var(--shadow)}
.lie-backhub:hover{background:var(--green-ink);color:#fff}
.lp-embed{margin:12px 0 4px}
.dsrc-card{display:flex;align-items:center;gap:11px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px;text-decoration:none}
.dsrc-card:hover{border-color:var(--green-ink)}
.dsrc-thumb{width:60px;height:60px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--paper2)}
.dsrc-thumb.noimg{display:grid;place-items:center;font-size:1.3rem}
.dsrc-meta{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.dsrc-meta b{font-size:.9rem;color:var(--ink)}
.dsrc-meta>span{font-size:.78rem;color:var(--green-ink);font-weight:800}
/* case study / real-life examples */
.case{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.case-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.case-k{font-size:.64rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#9a6a06}
.case-h b{font-family:"Lora",serif;font-size:1.04rem;color:var(--ink);font-weight:700}
.newslist{display:grid;gap:8px;margin-top:11px}
.newslink{display:block;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--paper);transition:border-color .15s,transform .12s}
.newslink:hover{border-color:var(--gold);transform:translateY(-1px)}
.newslink .src{display:block;font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

         sh:"Refinery ya oil ya $17bn inakuja Lamu"},
  summary:{en:"The Dangote Group's Lamu oil refinery keeps escalating: Dangote now confirms groundbreaking on the 700,000-barrel-a-day plant by October 2026, with the cost trimmed to about Sh2tn ($16bn), and on 11 August 2026 the government added plans for a Sh12.9bn palm oil processing plant nearby — while Greenpeace Africa demands approvals be halted, weighing legal action, until an independent environmental assessment and genuine public participation are done.",
           sw:"Kiwanda cha kusafisha mafuta cha Dangote huko Lamu kinazidi kuharakisha: Dangote sasa anathibitisha ujenzi wa kituo cha mapipa 700,000 kwa siku utaanza ifikapo Oktoba 2026, gharama ikipunguzwa hadi takriban Sh trilioni 2 ($16bn), na tarehe 11 Agosti 2026 serikali iliongeza mpango wa kiwanda cha kusindika mafuta ya mawese cha Sh bilioni 12.9 karibu na hapo — huku Greenpeace Africa ikitaka idhini isitishwe, ikipima hatua za kisheria, hadi tathmini huru ya mazingira na ushirikishwaji wa kweli wa umma ufanyike.",

  happening:{en:["In July 2026 the Dangote Group — owned by Africa's richest man, Aliko Dangote — announced it had chosen Lamu for a proposed 700,000-barrel-per-day oil refinery and petrochemical complex. At around US$17 billion (Sh2.59 trillion), it would be the largest refinery in East Africa.",
    "The project was moved from Tanzania to Kenya, and the company says design and engineering have begun, with construction estimated at three to five years. President Ruto has said it will create at least 60,000 jobs and make Kenya a regional energy hub — on the same Lamu coast, a UNESCO World Heritage area, where a coal plant was defeated in 2019."],
    sw:["Julai 2026 Kundi la Dangote — linalomilikiwa na tajiri mkubwa zaidi Afrika, Aliko Dangote — lilitangaza limechagua Lamu kwa kiwanda cha kusafisha mafuta cha mapipa 700,000 kwa siku pamoja na kiwanda cha petrokemikali. Kwa gharama ya takriban dola bilioni 17 (Sh trilioni 2.59), kingekuwa kikubwa zaidi Afrika Mashariki.",

    sh:["July 2026 Dangote Group — inayomilikiwa na tajiri mkubwa zaidi Africa, Aliko Dangote — walitangaza wamechagua Lamu kwa refinery ya mapipa 700,000 kwa siku pamoja na petrochemical complex. Kwa kama dola bilioni 17 (Sh trilioni 2.59), ingekuwa kubwa zaidi East Africa.",
    "Project ilihamishwa kutoka Tanzania hadi Kenya, na kampuni inasema design na engineering imeanza, construction ikikadiriwa miaka 3 hadi 5. Rais Ruto amesema italeta jobs zisizopungua 60,000 na kufanya Kenya hub ya energy ya region — kwa hiyo hiyo coast ya Lamu, place ya urithi ya UNESCO, ambapo coal plant ilishindwa 2019."]},
  narrative:{en:["The refinery is being presented as a historic win: 60,000 jobs, fuel security for East Africa, a new industrial hub, and proof that Kenya can attract mega-investment. Backing from Africa's richest man is treated as a seal of approval, and raising concerns is framed as standing in the way of jobs and progress."],
    sw:["Kiwanda kinawasilishwa kama ushindi wa kihistoria: ajira 60,000, uhakika wa mafuta Afrika Mashariki, kitovu kipya cha viwanda, na uthibitisho kwamba Kenya inaweza kuvutia uwekezaji mkubwa. Kuungwa mkono na tajiri mkubwa zaidi Afrika kunachukuliwa kama muhuri wa idhini, na kutoa wasiwasi kunachorwa kama kuzuia ajira na maendeleo."],
    sh:["Refinery inawasilishwa kama win ya kihistoria: jobs 60,000, fuel security ya East Africa, hub mpya ya viwanda, na proof Kenya inaweza kuvutia mega-investment. Support ya tajiri mkubwa zaidi Africa inachukuliwa kama stamp ya approval, na kuraise concerns inaonekana kama unazuia jobs na maendeleo."]},
  gap:{en:["The 60,000-jobs figure is a promise, not yet a plan on paper. Refineries are capital-intensive: most permanent roles are highly specialised, while the big numbers usually describe short-term construction work. It's fair — not anti-development — to ask for the breakdown: how many jobs are permanent, how many go to local residents, and for how long.",
    "There are bigger questions too, and they deserve honest answers rather than slogans. The refinery would sit beside the UNESCO-listed Lamu seascape and the fishing grounds communities have already gone to court to protect; it raises real concerns about air quality, carbon emissions and 'stranded assets' as the world shifts off oil; and a plant this large could shape the region's fuel market for decades. The point isn't that the project is simply good or bad — it's that a decision this big needs the full facts, the environmental studies, and genuine public participation first. That is a right, and Lamu has used it before."],
    sw:["Idadi ya ajira 60,000 ni ahadi, bado si mpango ulioandikwa. Viwanda vya kusafisha mafuta vinahitaji mtaji mkubwa: nafasi nyingi za kudumu ni za utaalamu wa hali ya juu, huku idadi kubwa mara nyingi ikimaanisha kazi za ujenzi za muda mfupi. Ni haki — si kupinga maendeleo — kuuliza mchanganuo: ajira ngapi ni za kudumu, ngapi zinaenda kwa wakazi wa eneo, na kwa muda gani.",

    sh:["Hiyo namba ya jobs 60,000 ni promise, bado si plan iliyoandikwa. Refineries zinahitaji capital kubwa: roles nyingi za permanent ni za utaalam wa juu, na hizo namba kubwa mostly ni construction work ya muda mfupi. Ni sawa — si kupinga maendeleo — kuuliza breakdown: jobs ngapi ni permanent, ngapi zinaenda kwa wakazi wa hapa, na kwa muda gani.",

  summary:{en:"A 1,050 MW coal plant was planned beside Lamu Old Town. Communities and courts stopped it — and by 2025 the backers had walked away.",
           sw:"Mtambo wa makaa wa MW 1,050 ulipangwa kando ya Mji wa Kale wa Lamu. Jamii na mahakama zikaukomesha — na kufikia 2025 wafadhili walikuwa wamejitoa.",
           sh:"Coal plant ya 1,050 MW ilikuwa ipangwe kando ya Lamu Old Town. Community na court zikaistop — na kufikia 2025 wenye pesa wakawacha."},
  happening:{en:["In 2013 the government approved a 1,050-megawatt coal-fired power plant at Kwasasi, near Lamu Old Town — a UNESCO World Heritage site — to be built by Amu Power with financing from Chinese and other foreign lenders.",
    "Lamu residents, fishers and the Save Lamu coalition challenged it. In June 2019 the National Environment Tribunal cancelled the plant's licence, ruling the environmental study inadequate and the public participation a sham. Financing collapsed, and by 2025 the last backers had pulled out. The plant was never built."],
    sw:["Mwaka 2013 serikali iliidhinisha mtambo wa umeme wa makaa wa MW 1,050 huko Kwasasi, karibu na Mji wa Kale wa Lamu — eneo la urithi wa dunia la UNESCO — ujengwe na Amu Power kwa ufadhili kutoka China na wakopeshaji wengine wa kigeni.",
    "Wakazi wa Lamu, wavuvi na muungano wa Save Lamu waliupinga. Mnamo Juni 2019 Baraza la Kitaifa la Mazingira lilifuta leseni ya mtambo, likisema utafiti wa mazingira haukutosha na ushirikishwaji wa umma ulikuwa wa uongo. Ufadhili ukaanguka, na kufikia 2025 wafadhili wa mwisho walikuwa wamejitoa. Mtambo haukujengwa kamwe."],
    sh:["2013 serikali iliapprove coal plant ya MW 1,050 huko Kwasasi, karibu na Lamu Old Town — place ya urithi ya UNESCO — ijengwe na Amu Power, pesa ikitoka China na wakopeshaji wa nje.",
    "Watu wa Lamu, wavuvi na Save Lamu wakapinga. June 2019 Environment Tribunal ikacancel leseni, ikisema EIA haikutosha na public participation ilikuwa ya kubuni. Pesa ikaisha, na kufikia 2025 wenye pesa wa mwisho wakawacha. Plant haikujengwa kabisa."]},
  narrative:{en:["The plant was sold as the answer to Kenya's power needs: cheap, reliable 'baseload' electricity to industrialise the country. Officials argued that coal is efficient, affordable energy — the fuel that built China, Germany and America — and that it was unfair for the West to deny Africa the same path. Amu Power promised thousands of jobs and a modern Lamu."],
    sw:["Mtambo uliuzwa kama jibu la mahitaji ya umeme ya Kenya: umeme wa bei nafuu na wa kutegemewa wa kuendeleza viwanda. Maafisa walisema makaa ni nishati bora na nafuu — mafuta yaliyojenga China, Ujerumani na Amerika — na kwamba si haki Magharibi kunyima Afrika njia hiyo hiyo. Amu Power iliahidi maelfu ya ajira na Lamu ya kisasa."],
    sh:["Plant iliuzwa kama solution ya umeme ya Kenya: power ya bei poa, ya kutegemewa, ya kuindustrialize nchi. Serikali ikasema coal ni efficient na cheap — ndio ilijenga China, Germany na America — na si fair Magharibi wakatae Africa hiyo njia. Amu Power ikapromise majobo elfu na Lamu ya kisasa."]},
  gap:{en:["Here's what that pitch left out. Kenya has almost no coal — the plant would have burned imported coal, tying our power bills to a shipped-in fuel and a foreign loan. Kenya's grid was already more than 80% renewable (geothermal, hydro, wind); the country didn't need coal 'baseload', and the plant would have become the single biggest source of climate pollution in Kenya.",
    "The 'the West built on coal' argument leaves out that those same countries are now shutting coal down as fast as they can. The promised jobs were few and mostly for outside experts, while Lamu's fishers would have lived with the ash and warm water for good. The real win: ordinary people used the law — real public participation and a UNESCO-protected coast — to shape a project the powerful had already signed. The same tools protect the next place."],
    sw:["Hiki ndicho ujumbe huo uliacha. Kenya haina makaa kwa wingi — mtambo ungechoma makaa yaliyoagizwa nje, ukifunga bili zetu za umeme kwenye mafuta ya kuletwa na mkopo wa kigeni. Gridi ya Kenya ilikuwa tayari zaidi ya 80% nishati mbadala (jotoardhi, maji, upepo); nchi haikuhitaji makaa, na mtambo ungekuwa chanzo kikubwa zaidi cha uchafuzi wa tabianchi nchini.",
    "Hoja ya 'Magharibi walijengwa na makaa' inaacha kwamba nchi hizo hizo sasa zinafunga makaa haraka iwezekanavyo. Ajira zilizoahidiwa zilikuwa chache na hasa za wataalamu wa nje, huku wavuvi wa Lamu wakiachwa na majivu na maji ya moto milele. Ushindi halisi: watu wa kawaida walitumia sheria — ushirikishwaji wa kweli na pwani inayolindwa na UNESCO — kuunda upya mradi ambao wenye nguvu walikuwa wamesaini. Zana hizo hizo zinalinda mahali panapofuata."],
    sh:["Hii ndio hiyo pitch iliacha. Kenya haina coal — plant ingechoma coal ya kuimport, ikifunga bills zetu kwa fuel ya kuletwa na loan ya nje. Grid ya Kenya ilikuwa tayari zaidi ya 80% renewable (geothermal, maji, upepo); hatukuneed coal, na plant ingekuwa chanzo kikubwa cha pollution ya climate Kenya.",
    "Hiyo story ya 'Magharibi walitumia coal' inaacha ati hao hao sasa wanastop coal haraka. Hizo jobs zilikuwa kidogo, mostly za wataalam wa nje, na wavuvi wa Lamu wangebaki na majivu na maji moto milele. Win ya kweli: watu wa kawaida walitumia sheria — public participation ya kweli na coast inaprotectiwa na UNESCO. Hizo tools zinaprotect place inayofuata."]},
  action:{en:"Lamu proves it can be done. Know the two tools that shaped it: your right to real public participation, and protected land. Share this with anyone who thinks coal was 'lost jobs'.",
    sw:"Lamu inathibitisha inawezekana. Fahamu zana mbili zilizosaidia: haki yako ya ushirikishwaji wa kweli, na ardhi inayolindwa. Shiriki hii na yeyote anayefikiri makaa yalikuwa 'ajira zilizopotea'.",
    sh:"Lamu inaproof inawezekana. Jua hizo tools mbili: right yako ya public participation ya kweli, na ardhi inayoprotectiwa. Share na mtu yeyote anafikiri coal ilikuwa 'jobs zimepotea'."},
  related:[{t:"basic",id:"climate-justice"},{t:"myth",id:"coal"}] },

{ id:"lamu-oil", status:"ongoing", place:{en:"Lamu / Turkana",sw:"Lamu / Turkana",sh:"Lamu / Turkana"},
  title:{en:"Oil, the Lamu port and the LAPSSET promise",
         sw:"Mafuta, bandari ya Lamu na ahadi ya LAPSSET",
         sh:"Oil, bandari ya Lamu na ile promise ya LAPSSET"},
  summary:{en:"A mega-port and pipeline promise to turn oil into prosperity for Kenya's poorest regions. The fishers and herders are still waiting.",
           sw:"Bandari kubwa na bomba vinaahidi kugeuza mafuta kuwa ustawi kwa maeneo maskini zaidi ya Kenya. Wavuvi na wafugaji bado wanasubiri.",
           sh:"Bandari kubwa na pipeline zinapromise kugeuza oil kuwa utajiri kwa maeneo maskini za Kenya. Wavuvi na wafugaji bado wanangoja."},
  happening:{en:["LAPSSET — the Lamu Port–South Sudan–Ethiopia Transport corridor — is a mega-project: a 32-berth port at Lamu plus roads, a railway and an oil pipeline meant to carry crude from the Turkana oil fields to the coast. The first berths at Lamu are built and operating.",
    "Lamu fishers went to court over lost fishing grounds and won compensation of about 1.76 billion shillings in 2018. In Turkana, oil development has repeatedly stalled over land, revenue-sharing and transport disputes, and full-scale export has yet to happen."],
    sw:["LAPSSET — korido ya Usafiri ya Bandari ya Lamu–Sudan Kusini–Ethiopia — ni mradi mkubwa: bandari ya vituo 32 huko Lamu pamoja na barabara, reli na bomba la mafuta la kubeba mafuta ghafi kutoka mashamba ya Turkana hadi pwani. Vituo vya kwanza vya Lamu vimejengwa na vinafanya kazi.",
    "Wavuvi wa Lamu walienda mahakamani kuhusu maeneo ya uvuvi yaliyopotea na wakashinda fidia ya takriban shilingi bilioni 1.76 mwaka 2018. Huko Turkana, uendelezaji wa mafuta umekwama mara kwa mara kutokana na migogoro ya ardhi, mgawanyo wa mapato na usafiri, na usafirishaji kamili bado haujafanyika."],
    sh:["LAPSSET — corridor ya Lamu Port–South Sudan–Ethiopia — ni mega-project: bandari ya berths 32 Lamu pamoja na barabara, reli na pipeline ya oil ya kubeba crude kutoka Turkana oil fields hadi coast. Berths za kwanza za Lamu zimejengwa, zinafanya kazi.",
    "Wavuvi wa Lamu walienda court juu ya fishing grounds zilizopotea, wakashinda compensation ya kama shilingi bilioni 1.76 mwaka 2018. Turkana, oil imestall mara nyingi juu ya ardhi, revenue-sharing na transport, na export kamili bado haijafika."]},
  narrative:{en:["The corridor is sold as transformation for Kenya's forgotten north and coast: oil money, a world-class port, jobs, roads and cities rising in the desert. 'Oil will lift the region out of poverty' is the headline; opposing it is framed as standing against development — and against your own community's future."],
    sw:["Korido inauzwa kama mageuzi kwa kaskazini na pwani iliyosahaulika ya Kenya: pesa za mafuta, bandari ya kiwango cha juu, ajira, barabara na miji ikichipuka jangwani. 'Mafuta yatatoa eneo kwenye umaskini' ndiyo kichwa cha habari; kuupinga kunachorwa kama kupinga maendeleo — na mustakabali wa jamii yako mwenyewe."],
    sh:["Corridor inauzwa kama transformation ya north na coast iliyosahauliwa: doo za oil, bandari ya world-class, majobo, barabara na miji ikijengeka jangwani. 'Oil itatoa region kwa umaskini' ndio headline; kupinga inaonekana kama unapinga maendeleo — na future ya community yako."]},
  gap:{en:["Oil is capital-intensive, not labour-intensive. A finished pipeline and an automated port employ very few people, and the skilled jobs go to expatriates and outside contractors — the region gets construction work that ends when the building does. Meanwhile the land taken for the corridor is pastoralist and fisher land, often held communally with contested or no titles, and the fishing grounds that already feed Lamu can be damaged for good.",
    "'Resource-rich, people-poor' is a pattern across Africa, not bad luck: oil revenue is volatile and easily lost to debt and leakage. The Lamu fishers' court win points to the honest questions to ask of any 'oil will save us' promise — who exactly gets the jobs, who loses the land and sea, and what happens to us when the oil runs out?"],
    sw:["Mafuta yanahitaji mtaji mkubwa, si wafanyakazi wengi. Bomba lililokamilika na bandari ya kiotomatiki huajiri watu wachache sana, na kazi za ujuzi huenda kwa wageni na wakandarasi wa nje — eneo hupata kazi za ujenzi zinazoisha ujenzi ukiisha. Wakati huohuo ardhi iliyochukuliwa kwa korido ni ya wafugaji na wavuvi, mara nyingi ya jamii yenye hati zenye mgogoro au bila hati, na maeneo ya uvuvi yanayolisha Lamu yanaweza kuharibiwa milele.",
    "'Tajiri wa maliasili, maskini wa watu' ni mtindo barani Afrika, si bahati mbaya: mapato ya mafuta hubadilikabadilika na hupotea kwa deni na uvujaji. Ushindi wa mahakama wa wavuvi wa Lamu unaelekeza kwenye maswali ya kweli ya kuuliza kila ahadi ya 'mafuta yatatuokoa' — ni nani hasa anapata ajira, ni nani anapoteza ardhi na bahari, na itakuwaje kwetu mafuta yakiisha?"],
    sh:["Oil inahitaji capital kubwa, si watu wengi. Pipeline iliyokamilika na port ya automated inaajiri watu wachache sana, na skilled jobs zinaenda kwa expats na contractors wa nje — region inapata construction work inayoisha ujenzi ukiisha. Na ardhi iliyochukuliwa kwa corridor ni ya wafugaji na wavuvi, mostly ya community bila title deeds clear, na fishing grounds zinazolisha Lamu zinaeza haribika kabisa.",
    "'Resource-rich, people-poor' ni pattern kote Africa, si bahati mbaya: doo za oil zinabadilika na zinapotea kwa madeni na wizi. Win ya court ya wavuvi wa Lamu inaonyesha maswali ya kweli kwa kila promise ya 'oil itatuokoa' — ni nani anapata jobs, ni nani anapoteza ardhi na bahari, na itakuaje kwetu oil ikiisha?"]},
  action:{en:"Before the next 'oil = jobs' promise, ask three things: who gets the jobs, who loses the land and sea, and what's the plan when the oil runs out?",
    sw:"Kabla ya ahadi ijayo ya 'mafuta = ajira', uliza mambo matatu: nani anapata ajira, nani anapoteza ardhi na bahari, na mpango ni upi mafuta yakiisha?",
    sh:"Kabla ya promise ingine ya 'oil = jobs', uliza vitu tatu: nani anapata jobs, nani anapoteza ardhi na bahari, na plan ni gani oil ikiisha?"},
  related:[{t:"myth",id:"oil"},{t:"basic",id:"climate-justice"}] },

{ id:"western-gold", status:"threat", place:{en:"Kakamega / Siaya",sw:"Kakamega / Siaya",sh:"Kakamega / Siaya"},
  title:{en:"Gold, guns and eviction in Western Kenya",
         sw:"Dhahabu, bunduki na kufukuzwa Magharibi mwa Kenya",
         sh:"Dhahabu, bunduki na eviction Western Kenya"},
  summary:{en:"A British company is opening a huge gold mine at Ikolomani. In 2026, protests over evictions turned deadly.",
           sw:"Kampuni ya Uingereza inafungua mgodi mkubwa wa dhahabu Ikolomani. Mwaka 2026, maandamano dhidi ya kufukuzwa yaligeuka mabaya.",
           sh:"Kampuni ya wazungu inachimba dhahabu Ikolomani. 2026, maandamano juu ya eviction yakawa deadly."},
  happening:{en:["Shanta Gold, a British-owned company, is developing large gold deposits in Western Kenya — at Ikolomani in Kakamega and around Gem-Ramula in Siaya. Roughly 1,200 households face relocation.",
    "In 2026, protests against forced evictions at Gem-Ramula turned deadly when police opened fire, killing residents. The deposits are valued in the hundreds of billions of shillings."],
    sw:["Shanta Gold, kampuni inayomilikiwa na Waingereza, inaendeleza mashapo makubwa ya dhahabu Magharibi mwa Kenya — huko Ikolomani (Kakamega) na maeneo ya Gem-Ramula (Siaya). Takriban kaya 1,200 zinakabiliwa na kuhamishwa.",
    "Mwaka 2026, maandamano dhidi ya kufukuzwa kwa nguvu Gem-Ramula yaligeuka mabaya polisi walipofyatua risasi, wakiua wakazi. Mashapo haya yanakadiriwa kufikia mamia ya mabilioni ya shilingi."]},
  narrative:{en:["Officials and the company frame the mines as a treasure that will bring jobs, roads and development to Western Kenya. Newspapers headline a 'Sh683 billion gold treasure'. The story: this is progress, and the protesters are blocking it."],
    sw:["Maafisa na kampuni wanachora migodi kama hazina itakayoleta ajira, barabara na maendeleo Magharibi. Magazeti yanaandika 'hazina ya dhahabu ya Sh683 bilioni'. Hadithi: huu ni maendeleo, na waandamanaji wanauzuia."]},
  gap:{en:["What the treasure headlines leave out: the gold is exported, the profit goes to shareholders abroad, and the real jobs are few and short-term. The land taken is ancestral and the titles are contested. It echoes Lamu coal and the Mui Basin — a big foreign project, thin consultation, and the community paying with their land and this time their lives.",
    "The question worth asking of the 'treasure' story: who owns the minerals under community land, and who gets to decide? The encouraging part is that the same law that shaped the Lamu decision — real public participation and protected community land — applies here too."],
    sw:["Kile vichwa vya 'hazina' vinaacha: dhahabu inasafirishwa nje, faida inaenda kwa wenye hisa ng'ambo, na ajira halisi ni chache na za muda. Ardhi inayochukuliwa ni ya asili na hati zina mgogoro. Inafanana na makaa ya Lamu na Bonde la Mui — mradi mkubwa wa kigeni, ushauri hafifu, jamii inalipa kwa ardhi na safari hii kwa maisha.",
    "Swali la kuuliza kwenye 'hazina': nani anamiliki madini chini ya ardhi ya jamii, na nani anaamua? Jambo la kutia moyo ni kwamba sheria ileile iliyosaidia uamuzi wa Lamu — ushirikishwaji wa kweli na ardhi ya jamii iliyolindwa — inatumika hapa pia."]},
  action:{en:"Know your land rights: community land is legally protected, and minerals need real consent. The Lamu playbook works here.",
    sw:"Fahamu haki zako za ardhi: ardhi ya jamii inalindwa kisheria, na madini yanahitaji ridhaa ya kweli. Mkakati wa Lamu unafanya kazi hapa."},
  related:[{t:"myth",id:"mining"},{t:"basic",id:"climate-justice"}] },

{ id:"turkana-wind", status:"decided", place:{en:"Marsabit",sw:"Marsabit",sh:"Marsabit"},
  title:{en:"Lake Turkana wind: green power, contested land",
         sw:"Upepo wa Ziwa Turkana: nishati safi, ardhi yenye mgogoro",
         sh:"Upepo wa Lake Turkana: green power, ardhi yenye mgogoro"},
  summary:{en:"Africa's biggest wind farm powers the grid — but sits on land the local community says was taken without consent.",
           sw:"Shamba kubwa zaidi la upepo Afrika linazalisha umeme — lakini liko kwenye ardhi jamii inasema ilichukuliwa bila ridhaa.",
           sh:"Wind farm kubwa zaidi Africa inazalisha power — lakini iko kwa ardhi community inasema ilichukuliwa bila consent."},
  happening:{en:["The Lake Turkana Wind Power project in Marsabit is the largest wind farm in Africa, feeding clean power into Kenya's grid. But the 150,000 acres it sits on is community land, and local Indigenous groups went to court arguing it was allocated without their consent.",
    "In 2021 the Environment and Land Court ruled the land allocation irregular and unlawful, and ordered the process regularised — a landmark judgment, even as the turbines keep turning."],
    sw:["Mradi wa Nishati ya Upepo wa Ziwa Turkana huko Marsabit ndio shamba kubwa zaidi la upepo barani Afrika, likipeleka nishati safi kwenye gridi ya Kenya. Lakini ekari 150,000 unazokaa ni ardhi ya jamii, na makundi ya asili ya wenyeji walienda mahakamani wakisema iligawiwa bila ridhaa yao.",
    "Mwaka 2021 Mahakama ya Mazingira na Ardhi iliamua ugawaji wa ardhi haukuwa halali, na ikaamuru mchakato urekebishwe — hukumu ya kihistoria, hata mitambo ikiendelea kuzunguka."]},
  narrative:{en:["The project is celebrated as a climate success story — proof that Kenya leads Africa on renewables, clean jobs and green investment. In that story, worrying about who owned the land looks like getting in the way of saving the planet."],
    sw:["Mradi unasherehekewa kama hadithi ya mafanikio ya tabianchi — uthibitisho kwamba Kenya inaongoza Afrika kwa nishati mbadala, ajira safi na uwekezaji wa kijani. Katika hadithi hiyo, kuhangaikia nani alimiliki ardhi kunaonekana kama kuzuia kuokoa dunia."]},
  gap:{en:["'Green' does not automatically mean 'just'. A renewable project can still take community land without proper consent, and moving pastoralists for climate-friendly power is still displacement. The court agreed: the land process was unlawful, even though the electricity is clean.",
    "This is the heart of climate justice — how we move off fossil fuels matters as much as that we do. A just transition means the communities who host green projects share the benefits and give real consent, not just carry the cost so the grid can call itself clean."],
    sw:["'Kijani' haimaanishi moja kwa moja 'haki'. Mradi wa nishati mbadala bado unaweza kuchukua ardhi ya jamii bila ridhaa sahihi, na kuwahamisha wafugaji kwa ajili ya nishati rafiki wa tabianchi bado ni kuhamishwa. Mahakama ilikubali: mchakato wa ardhi haukuwa halali, hata kama umeme ni safi.",
    "Hii ndio kiini cha haki ya tabianchi — jinsi tunavyoacha nishati ya kisukuku ni muhimu kama vile kuiacha. Mpito wa haki unamaanisha jamii zinazokaribisha miradi ya kijani zinashiriki manufaa na kutoa ridhaa ya kweli, si kubeba tu gharama ili gridi ijiite safi."]},
  action:{en:"'Green' isn't a free pass. Ask whether the community consented and shares the benefit — that's what makes a transition just.",
    sw:"'Kijani' si kibali cha bure. Uliza kama jamii iliridhia na inashiriki manufaa — ndicho kinachofanya mpito uwe wa haki."},
  related:[{t:"myth",id:"renewable"},{t:"basic",id:"just-transition"}] },

{ id:"coast-plastics", status:"ongoing", place:{en:"Nairobi · Nakuru · Coast",sw:"Nairobi · Nakuru · Pwani",sh:"Nairobi · Nakuru · Coast"},
  title:{en:"Drowning in plastic: Dandora, Gioto and the coast",
         sw:"Kuzama kwenye plastiki: Dandora, Gioto na pwani",
         sh:"Kuzama kwa plastiki: Dandora, Gioto na coast"},
  summary:{en:"Kenya banned plastic bags — yet the dumpsites keep growing, and waste-pickers carry the health cost.",
           sw:"Kenya ilipiga marufuku mifuko ya plastiki — lakini madampo yanaendelea kukua, na wakusanya taka wanabeba gharama ya afya.",
           sh:"Kenya ilipiga ban mifuko ya plastiki — lakini madampo bado yanakua, na wakusanya taka wanabeba cost ya afya."},
  happening:{en:["Kenya banned single-use plastic bags in 2017 and barred single-use plastics from protected areas in 2020 — among the strongest plastic laws in Africa. Yet Dandora (Nairobi), Gioto (Nakuru) and coastal dumpsites keep growing, fed by packaging, sachets and imported waste.",
    "Thousands of people, many of them women and children, sort this waste by hand for a living — breathing smoke and handling hazardous material with no protection."]},
  narrative:{en:["The story told is one of success and personal responsibility: Kenya 'solved' plastic with a tough bag ban, and what's left is just a litter problem — people being dirty, communities failing to clean up."]},
  gap:{en:["A bag ban doesn't touch the flood of sachets, PET bottles and multinational packaging that has no return system, or the used plastic shipped in from rich countries. Blaming 'dirty communities' leaves out the producers who make single-use plastic the cheapest option and take no responsibility for its end.",
    "The waste-pickers of Dandora are not the problem — they are doing the recycling the system won't. Real solutions bring in producers (make them responsible for their packaging), not just the poorest people at the end of the chain."]},
  action:{en:"Next time you hear 'just don't litter', ask who makes the sachet — and who is paid to clean it up.",
    sw:"Wakati mwingine unaposikia 'msitupe taka ovyo', uliza nani anatengeneza sachet — na nani analipwa kuisafisha."},
  related:[{t:"basic",id:"climate-justice"}] },

{ id:"siaya-nuclear", status:"ongoing", place:{en:"Siaya · Lake Victoria",sw:"Siaya · Ziwa Victoria",sh:"Siaya · Lake Victoria"},
  title:{en:"A nuclear plant on Lake Victoria — and a community pushing back",
         sw:"Mtambo wa nyuklia kando ya Ziwa Victoria — na jamii inayopinga",
         sh:"Nuclear plant kando ya Ziwa Victoria — na community inapinga"},
  summary:{en:"Kenya's Sh500bn Bondo nuclear plan keeps escalating: freed protesters remain under a police terrorism investigation, and on 7 August 2026 the Kenya Left Alliance told the state not to impose the plant on Siaya, calling it opaque and top-down, while NuPEA publicly defended the project — deepening the standoff rights groups have condemned.",
           sw:"Mpango wa nyuklia wa Sh bilioni 500 Bondo unazidi kuzua mvutano: waandamanaji walioachiliwa bado wanachunguzwa na polisi kwa tuhuma za ugaidi, na tarehe 7 Agosti 2026 Kenya Left Alliance iliiambia serikali isilazimishe mtambo huo kwa Siaya, ikiuita mradi usio wazi na wa juu-chini, huku NuPEA ikitetea mradi hadharani — hali inayozidisha mvutano ambao makundi ya haki yamelaani.",
           sh:"Plan ya nuclear ya Sh billion 500 Bondo inazidi kuleta tension: waandamanaji walioachiliwa bado wako under terror investigation ya polisi, na tarehe 7 August 2026 Kenya Left Alliance iliambia serikali isiforce hiyo plant kwa Siaya, ikiiita project ya opaque na top-down, huku NuPEA ikidefend project hadharani — hali inayoongeza standoff ambayo human rights groups zimecondemn."},
  happening:{en:["Kenya is planning its first nuclear power plant — a roughly 2,000-megawatt station at Bondo in Siaya, on Lake Victoria, estimated at around Sh500 billion, targeting first power by 2034.",
    "It has met fierce local resistance. At a NuPEA public-participation meeting in Bondo on 24 July 2026, residents shouted 'Wadagi' (Luo for 'we don't want it'); a police officer opened fire and one person was shot in the leg. Seventeen people were arrested — the prosecution pushed for terrorism-related charges, but a Bondo court freed all 17 on Sh15,000 bail each. The Kenya Anti-Nuclear Alliance has condemned the violence and called for a rights-based, just energy transition."],
    sw:["Kenya inapanga mtambo wake wa kwanza wa nyuklia — kituo cha takriban MW 2,000 huko Bondo, Siaya, kando ya Ziwa Victoria, kinachokadiriwa Sh bilioni 500, kikilenga umeme wa kwanza ifikapo 2034.",
    "Umekumbana na upinzani mkali. Kwenye mkutano wa ushirikishwaji wa NuPEA huko Bondo tarehe 24 Julai 2026, wakazi walipiga kelele 'Wadagi' (Kiluo cha 'hatutaki'); afisa wa polisi alifyatua risasi na mtu mmoja akapigwa mguuni. Watu 17 walikamatwa — upande wa mashtaka ukataka mashtaka ya ugaidi, lakini mahakama ya Bondo iliwaachilia wote kwa dhamana ya Sh15,000. Kenya Anti-Nuclear Alliance imelaani vurugu hizo."]},
  narrative:{en:["Nuclear is presented as clean, modern, high-tech baseload power — proof that Kenya is joining the big leagues, with jobs, industry and prestige to follow."],
    sw:["Nyuklia inawasilishwa kama nishati safi, ya kisasa, ya teknolojia ya juu — uthibitisho kwamba Kenya inajiunga na mataifa makubwa, ikifuatiwa na ajira, viwanda na heshima."]},
  gap:{en:["'Clean' skips the hard parts: where the radioactive waste goes for thousands of years, what a lakeside accident would mean for Lake Victoria's fishery and the millions who depend on it, and whether a project this expensive is the right bet when Kenya's cheap geothermal and solar are nowhere near tapped out.",

  a:{en:["You've felt it: the rains no longer come when the old calendar says they should. Long rains fail, then floods wash the roads away; the seasons your grandparents could name have stopped behaving. That's climate change — the planet heating up because the world burned too much coal, oil and gas.",

{ id:"climate-justice",
  q:{en:"What does climate justice mean?",sw:"Haki ya tabianchi ina maana gani?",sh:"Climate justice ina maana gani?"},
  a:{en:["Climate change was caused mostly by rich countries that burned coal and oil for a hundred years to get wealthy. But it's poor communities — who burned almost nothing — who suffer first and worst: the herder in Marsabit burying cattle killed by drought, the family in Budalangi flooded out again.",
    "Climate justice is fairness applied to that: those who caused the crisis should help fix it, and the people living it should have a real say in how. It isn't charity or aid — it's fairness. When you're told to 'adapt' to failing rains or move for a 'green' project, climate justice is the idea that says who should pay, and that your consent and your land count."],
    sw:["Mabadiliko ya tabianchi yalisababishwa zaidi na nchi tajiri zilizochoma makaa na mafuta kwa miaka mia moja ili kutajirika. Lakini ni jamii maskini — zilizochoma karibu chochote — ndizo zinateseka kwanza na zaidi: mfugaji Marsabit anazika ng'ombe waliouawa na ukame, familia Budalangi imefurikwa tena.",

    sh:["Climate change ilisababishwa zaidi na hizo nchi za matajiri zilichoma makaa na oil kwa miaka mob wapate doo. Lakini ni sisi wa mashinani — hatujachoma kitu — ndio tunahangaika kwanza na zaidi: mfugaji Marsabit anazika ng'ombe zimeuawa na ukame, family Budalangi imefurikwa tena.",
    "Climate justice ni fairness kwa hiyo: waliharibu wasaidie kurekebisha, na sisi tunaoumia tuwe na say ya kweli aje. Si msaada — ni fairness. Ukiambiwa 'adapt' kwa mvua zinakosa ama uhame kwa project ya 'green', climate justice ndio wazo linasema nani alipe, na consent yako na ardhi yako zinacount."]} },
{ id:"carbon-credits",
  q:{en:"What are carbon credits?",sw:"Mikopo ya kaboni ni nini?",sh:"Carbon credits ni nini?"},
  a:{en:["A carbon credit is a permit that says one tonne of climate-heating gas was stopped or removed somewhere. Rich companies buy these credits so they can keep polluting while claiming to be 'net zero' or 'carbon neutral'.",
    "Often the 'somewhere' is community land in northern Kenya — grasslands signed up to carbon projects. The promise is money for communities; the reality is often that outsiders profit, pastoralists lose control of grazing, and the polluter keeps polluting. The useful question is always: who really benefits, and who signed away the use of your land?"],
    sw:["Mkopo wa kaboni ni kibali kinachosema tani moja ya gesi inayopasha joto tabianchi ilizuiwa au kuondolewa mahali fulani. Makampuni tajiri hununua vibali hivi ili waendelee kuchafua huku wakidai kuwa 'sifuri halisi' au 'hawana kaboni'.",
    "Mara nyingi 'mahali fulani' ni ardhi ya jamii kaskazini mwa Kenya — nyanda zilizoandikishwa kwenye miradi ya kaboni. Ahadi ni pesa kwa jamii; uhalisia mara nyingi ni kwamba wageni wananufaika, wafugaji wanapoteza udhibiti wa malisho, na mchafuzi anaendelea kuchafua. Swali la maana daima ni: nani hasa ananufaika, na nani alisaini kuachia matumizi ya ardhi yako?"]} },
{ id:"just-transition",
  q:{en:"What is a 'just transition'?",sw:"'Mpito wa haki' ni nini?",sh:"'Just transition' ni nini?"},
  a:{en:["The world has to move off coal, oil and gas. A 'just transition' means doing that in a way that doesn't dump the cost on workers and communities who had the least to do with the problem — retraining people, protecting livelihoods, and sharing the benefits of clean energy.",
    "It's the difference between a green project that takes a community's land without consent, and one the community actually owns a stake in. For Kenya, a just transition is the whole point: we can build clean power and still get it wrong if the people who host it carry the cost and get none of the gain."],
    sw:["Dunia lazima iache makaa, mafuta na gesi. 'Mpito wa haki' unamaanisha kufanya hivyo kwa njia isiyotupa gharama kwa wafanyakazi na jamii ambao hawakuchangia tatizo — kuwafunza watu upya, kulinda maisha, na kushiriki manufaa ya nishati safi.",

function applyHash(scroll){
  var h=(location.hash||"").replace(/^#/,"");
  if(h==="lie"||h.indexOf("lie/")===0){
    var id=h.indexOf("lie/")===0?h.slice(4):"";
    state.view="learn"; state.learnTab="d"; state.focusLie=id||null; render();
    if(id){ var el=document.getElementById("lie-"+id); if(el){ el.scrollIntoView({behavior:scroll?"smooth":"auto",block:"start"}); el.classList.add("flash"); } }
    return true;
  }
  if(h.indexOf("disinfo/")===0){
    state.disinfoId=h.slice(8).replace(/[^0-9]/g,""); state.view="disinfo"; render(); return true;
  }
  if(h.indexOf("flag/")===0){
    var parts=h.slice(5).split("/");
    state.flagPost=(parts[0]||"").replace(/[^0-9]/g,"");
    state.flagVerdict=parts[1]?decodeURIComponent((parts[1]||"").replace(/\+/g," ")):"";
    state.view="flag"; render(); return true;
  }
  return false;
}
window.addEventListener("hashchange",function(){ applyHash(true); });

if(!applyHash(false)) render();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
    var reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){ if(reloaded) return; reloaded=true; window.location.reload(); });
  });
}
</script>
